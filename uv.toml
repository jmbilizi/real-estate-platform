# UV configuration for the workspace
# See: https://docs.astral.sh/uv/reference/settings/

# Use system TLS certificates (required for corporate proxies/firewalls)
native-tls = true

# hf-xet is a HuggingFace download accelerator pulled in by fastembed.
# Its Windows wheel is unavailable on PyPI (403), but it's not required
# for inference — only for faster model downloads. Skip on Windows.
override-dependencies = ["hf-xet>=1.0.0; sys_platform != 'win32'"]
