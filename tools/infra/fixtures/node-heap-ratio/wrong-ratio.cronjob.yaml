apiVersion: batch/v1
kind: CronJob
metadata:
  name: test-workload
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: worker
              resources:
                limits:
                  memory: "768Mi"
              env:
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=999"
