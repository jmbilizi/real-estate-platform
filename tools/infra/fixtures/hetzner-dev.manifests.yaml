apiVersion: v1
data:
  init-databases.sh: "#!/bin/bash\nset -e\n\n# This script runs as the postgres user
    during container initialization\n# It creates additional databases beyond the
    default POSTGRES_DB\n\necho \"Starting database initialization...\"\n\n# Validate
    required passwords are set\nif [ -z \"${ACCOUNT_SERVICE_DB_USER_PASSWORD}\" ];
    then\n    echo \"WARNING: ACCOUNT_SERVICE_DB_USER_PASSWORD not set, using placeholder\"\n
    \   ACCOUNT_SERVICE_DB_USER_PASSWORD=\"changeme_account\"\nfi\nif [ -z \"${MESSAGING_SERVICE_DB_USER_PASSWORD}\"
    ]; then\n    echo \"WARNING: MESSAGING_SERVICE_DB_USER_PASSWORD not set, using
    placeholder\"\n    MESSAGING_SERVICE_DB_USER_PASSWORD=\"changeme_messaging\"\nfi\nif
    [ -z \"${PROPERTY_SERVICE_DB_USER_PASSWORD}\" ]; then\n    echo \"WARNING: PROPERTY_SERVICE_DB_USER_PASSWORD
    not set, using placeholder\"\n    PROPERTY_SERVICE_DB_USER_PASSWORD=\"changeme_property\"\nfi\n\n#
    Step 1: Create users first — they must exist before databases can reference them
    as owners.\npsql -v ON_ERROR_STOP=1 --username \"$POSTGRES_USER\" --dbname \"$POSTGRES_DB\"
    <<-EOSQL\n    -- Create dedicated users for each database\n    -- Using $BODY$
    delimiter instead of $$ to avoid Skaffold kustomize YAML parsing bug\n    DO \\$BODY\\$\n
    \   BEGIN\n        IF NOT EXISTS (SELECT FROM pg_user WHERE usename = 'account_service_db_user')
    THEN\n            CREATE USER account_service_db_user WITH PASSWORD '${ACCOUNT_SERVICE_DB_USER_PASSWORD}';\n
    \       END IF;\n        IF NOT EXISTS (SELECT FROM pg_user WHERE usename = 'messaging_service_db_user')
    THEN\n            CREATE USER messaging_service_db_user WITH PASSWORD '${MESSAGING_SERVICE_DB_USER_PASSWORD}';\n
    \       END IF;\n        IF NOT EXISTS (SELECT FROM pg_user WHERE usename = 'property_service_db_user')
    THEN\n            CREATE USER property_service_db_user WITH PASSWORD '${PROPERTY_SERVICE_DB_USER_PASSWORD}';\n
    \       END IF;\n    END\n    \\$BODY\\$;\nEOSQL\n\n# Step 2: Create databases
    owned by the corresponding service user.\n# Ownership grants the user full access
    including CREATE on the public schema\n# in PostgreSQL 15+ (via pg_database_owner
    membership) — no GRANT needed.\npsql -v ON_ERROR_STOP=1 --username \"$POSTGRES_USER\"
    --dbname \"$POSTGRES_DB\" <<-EOSQL\n    SELECT 'CREATE DATABASE account_db OWNER
    account_service_db_user'\n    WHERE NOT EXISTS (SELECT FROM pg_database WHERE
    datname = 'account_db')\\gexec\n    \n    SELECT 'CREATE DATABASE messaging_db
    OWNER messaging_service_db_user'\n    WHERE NOT EXISTS (SELECT FROM pg_database
    WHERE datname = 'messaging_db')\\gexec\n    \n    SELECT 'CREATE DATABASE property_db
    OWNER property_service_db_user'\n    WHERE NOT EXISTS (SELECT FROM pg_database
    WHERE datname = 'property_db')\\gexec\n\n    -- Transfer ownership for any pre-existing
    databases not owned by the service user\n    ALTER DATABASE account_db OWNER TO
    account_service_db_user;\n    ALTER DATABASE messaging_db OWNER TO messaging_service_db_user;\n
    \   ALTER DATABASE property_db OWNER TO property_service_db_user;\nEOSQL\n\n#
    Enable extensions on account_db\npsql -v ON_ERROR_STOP=1 --username \"$POSTGRES_USER\"
    --dbname \"account_db\" <<-EOSQL\n    CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";\n
    \   CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";\n    \n    -- Grant schema permissions
    to account_service_db_user\n    GRANT ALL ON SCHEMA public TO account_service_db_user;\n
    \   GRANT ALL ON ALL TABLES IN SCHEMA public TO account_service_db_user;\n    GRANT
    ALL ON ALL SEQUENCES IN SCHEMA public TO account_service_db_user;\n    GRANT ALL
    ON ALL FUNCTIONS IN SCHEMA public TO account_service_db_user;\n    ALTER DEFAULT
    PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO account_service_db_user;\n
    \   ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO account_service_db_user;\n
    \   ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO account_service_db_user;\nEOSQL\n\n#
    Enable extensions on messaging_db\npsql -v ON_ERROR_STOP=1 --username \"$POSTGRES_USER\"
    --dbname \"messaging_db\" <<-EOSQL\n    CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";\n
    \   \n    -- Grant schema permissions to messaging_service_db_user\n    GRANT
    ALL ON SCHEMA public TO messaging_service_db_user;\n    GRANT ALL ON ALL TABLES
    IN SCHEMA public TO messaging_service_db_user;\n    GRANT ALL ON ALL SEQUENCES
    IN SCHEMA public TO messaging_service_db_user;\n    GRANT ALL ON ALL FUNCTIONS
    IN SCHEMA public TO messaging_service_db_user;\n    ALTER DEFAULT PRIVILEGES IN
    SCHEMA public GRANT ALL ON TABLES TO messaging_service_db_user;\n    ALTER DEFAULT
    PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO messaging_service_db_user;\n
    \   ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO messaging_service_db_user;\nEOSQL\n\n#
    Setup property_db with extensions\npsql -v ON_ERROR_STOP=1 --username \"$POSTGRES_USER\"
    --dbname \"property_db\" <<-EOSQL\n    -- Enable essential extensions\n    CREATE
    EXTENSION IF NOT EXISTS \"uuid-ossp\";\n    CREATE EXTENSION IF NOT EXISTS \"postgis\";\n
    \   CREATE EXTENSION IF NOT EXISTS \"pg_trgm\";        -- Text search & similarity\n
    \   CREATE EXTENSION IF NOT EXISTS \"btree_gist\";     -- Advanced indexing\n
    \   CREATE EXTENSION IF NOT EXISTS \"vector\";         -- Embeddings (pgvector;
    superuser-only)\n\n    -- Grant all permissions to property_service_db_user\n
    \   GRANT ALL ON SCHEMA public TO property_service_db_user;\n    GRANT ALL ON
    ALL TABLES IN SCHEMA public TO property_service_db_user;\n    GRANT ALL ON ALL
    SEQUENCES IN SCHEMA public TO property_service_db_user;\n    GRANT ALL ON ALL
    FUNCTIONS IN SCHEMA public TO property_service_db_user;\n    ALTER DEFAULT PRIVILEGES
    IN SCHEMA public GRANT ALL ON TABLES TO property_service_db_user;\n    ALTER DEFAULT
    PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO property_service_db_user;\n
    \   ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO property_service_db_user;\nEOSQL\n\n#
    Setup appdb as shared/reference database\npsql -v ON_ERROR_STOP=1 --username \"$POSTGRES_USER\"
    --dbname \"appdb\" <<-EOSQL\n    -- Enable extensions for shared data\n    CREATE
    EXTENSION IF NOT EXISTS \"uuid-ossp\";      -- UUID generation\n    CREATE EXTENSION
    IF NOT EXISTS \"pg_trgm\";        -- Text search for lookups\n    CREATE EXTENSION
    IF NOT EXISTS \"hstore\";         -- Key-value storage for flexible configs\n
    \   CREATE EXTENSION IF NOT EXISTS \"tablefunc\";      -- Crosstab/pivot tables\n
    \   \n    -- Create schema for organization\n    CREATE SCHEMA IF NOT EXISTS reference;
    \          -- Lookup tables (countries, currencies, etc.)\n    CREATE SCHEMA IF
    NOT EXISTS config;              -- System-wide configuration\n    CREATE SCHEMA
    IF NOT EXISTS audit;               -- Cross-service audit logs\n    \n    -- Grant
    read-only access to all service users (they can read shared data)\n    GRANT USAGE
    ON SCHEMA reference TO account_service_db_user, messaging_service_db_user, property_service_db_user;\n
    \   GRANT SELECT ON ALL TABLES IN SCHEMA reference TO account_service_db_user,
    messaging_service_db_user, property_service_db_user;\n    ALTER DEFAULT PRIVILEGES
    IN SCHEMA reference GRANT SELECT ON TABLES TO account_service_db_user, messaging_service_db_user,
    property_service_db_user;\n    \n    GRANT USAGE ON SCHEMA config TO account_service_db_user,
    messaging_service_db_user, property_service_db_user;\n    GRANT SELECT ON ALL
    TABLES IN SCHEMA config TO account_service_db_user, messaging_service_db_user,
    property_service_db_user;\n    ALTER DEFAULT PRIVILEGES IN SCHEMA config GRANT
    SELECT ON TABLES TO account_service_db_user, messaging_service_db_user, property_service_db_user;\n
    \   \n    -- Grant write access to audit schema (all services can log)\n    GRANT
    USAGE ON SCHEMA audit TO account_service_db_user, messaging_service_db_user, property_service_db_user;\n
    \   GRANT INSERT ON ALL TABLES IN SCHEMA audit TO account_service_db_user, messaging_service_db_user,
    property_service_db_user;\n    ALTER DEFAULT PRIVILEGES IN SCHEMA audit GRANT
    INSERT ON TABLES TO account_service_db_user, messaging_service_db_user, property_service_db_user;\n
    \   \n    -- Grant admin full access to all schemas\n    GRANT ALL ON SCHEMA reference
    TO ${POSTGRES_USER};\n    GRANT ALL ON SCHEMA config TO ${POSTGRES_USER};\n    GRANT
    ALL ON SCHEMA audit TO ${POSTGRES_USER};\n    GRANT ALL ON ALL TABLES IN SCHEMA
    reference TO ${POSTGRES_USER};\n    GRANT ALL ON ALL TABLES IN SCHEMA config TO
    ${POSTGRES_USER};\n    GRANT ALL ON ALL TABLES IN SCHEMA audit TO ${POSTGRES_USER};\nEOSQL\n\necho
    \"✅ All databases, users, and extensions created successfully!\"\n"
  sync-passwords.sh: |
    #!/bin/bash
    # Runs on every Postgres startup via lifecycle.postStart.
    #
    # Responsibilities:
    #   1. Ensure databases exist.
    #   2. Ensure users exist and passwords are current.
    #   3. Make each service user OWN their database.
    #
    # Why ownership instead of GRANT:
    #   In PostgreSQL 15+, GRANT ALL ON DATABASE does not grant CREATE on the
    #   public schema. Ownership is stored in the pg_database catalog and
    #   survives PVC reuse across restarts — no re-granting ever needed.
    #   The database owner is a member of pg_database_owner, which holds
    #   CREATE on the public schema by default.
    #
    # Safety notes:
    #   - No set -e: must exit 0 so postStart never kills the postgres container.
    #   - All operations are idempotent (IF NOT EXISTS / ALTER is safe to repeat).
    TIMEOUT=60
    ELAPSED=0
    until pg_isready -U "$POSTGRES_USER" -q; do
      sleep 1
      ELAPSED=$((ELAPSED + 1))
      if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
        echo "sync-passwords: timed out waiting for Postgres — skipping (non-fatal)"
        exit 0
      fi
    done

    # --- Step 1: Ensure databases exist ---
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE account_db'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'account_db')\gexec

        SELECT 'CREATE DATABASE messaging_db'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'messaging_db')\gexec

        SELECT 'CREATE DATABASE property_db'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'property_db')\gexec
    EOSQL

    # --- Step 2: Ensure users exist and passwords are current ---
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        DO \$BODY\$
        BEGIN
            IF NOT EXISTS (SELECT FROM pg_user WHERE usename = 'account_service_db_user') THEN
                CREATE USER account_service_db_user WITH PASSWORD '${ACCOUNT_SERVICE_DB_USER_PASSWORD}';
                RAISE NOTICE 'sync-passwords: CREATED account_service_db_user';
            ELSE
                ALTER USER account_service_db_user WITH PASSWORD '${ACCOUNT_SERVICE_DB_USER_PASSWORD}';
                RAISE NOTICE 'sync-passwords: updated account_service_db_user';
            END IF;
            IF NOT EXISTS (SELECT FROM pg_user WHERE usename = 'messaging_service_db_user') THEN
                CREATE USER messaging_service_db_user WITH PASSWORD '${MESSAGING_SERVICE_DB_USER_PASSWORD}';
                RAISE NOTICE 'sync-passwords: CREATED messaging_service_db_user';
            ELSE
                ALTER USER messaging_service_db_user WITH PASSWORD '${MESSAGING_SERVICE_DB_USER_PASSWORD}';
                RAISE NOTICE 'sync-passwords: updated messaging_service_db_user';
            END IF;
            IF NOT EXISTS (SELECT FROM pg_user WHERE usename = 'property_service_db_user') THEN
                CREATE USER property_service_db_user WITH PASSWORD '${PROPERTY_SERVICE_DB_USER_PASSWORD}';
                RAISE NOTICE 'sync-passwords: CREATED property_service_db_user';
            ELSE
                ALTER USER property_service_db_user WITH PASSWORD '${PROPERTY_SERVICE_DB_USER_PASSWORD}';
                RAISE NOTICE 'sync-passwords: updated property_service_db_user';
            END IF;
        END
        \$BODY\$;
    EOSQL

    # --- Step 3: Transfer database ownership to each service user ---
    # ALTER DATABASE ... OWNER TO writes to pg_database.datdba — persisted in the
    # PVC catalog. Running this on every startup is idempotent and harmless.
    # The postgres superuser retains full access via its superuser privilege.
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        ALTER DATABASE account_db OWNER TO account_service_db_user;
        ALTER DATABASE messaging_db OWNER TO messaging_service_db_user;
        ALTER DATABASE property_db OWNER TO property_service_db_user;
    EOSQL

    # --- Step 4: Reconcile extensions that require SUPERUSER ---
    # This must live here, NOT only in init-databases.sh: that script is mounted into
    # /docker-entrypoint-initdb.d and therefore runs only when PGDATA is empty, so anything added
    # there silently never executes on an environment that already has a volume. This script runs on
    # every boot (lifecycle.postStart) as the superuser, and CREATE EXTENSION IF NOT EXISTS is
    # idempotent.
    #
    # The FULL set is reconciled here, not just newly-added ones. Dropping and recreating a single
    # database on a running cluster is a real operation (a schema reset), and it does not re-run initdb
    # — so a database recreated that way would come back with none of these, and property-service's
    # migrations would fail on the geography column with a permission error rather than a clear
    # "extension missing".
    #
    # Why the services cannot do this themselves: an extension is installable by a database owner only
    # if it is marked TRUSTED. Verified on this image: pg_trgm and uuid-ossp are trusted; postgis and
    # vector are NOT, so they require SUPERUSER and belong here. The pgvector .so ships in our own
    # image — see infra/docker/postgres/Dockerfile.
    psql --username "$POSTGRES_USER" --dbname property_db <<-EOSQL
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        CREATE EXTENSION IF NOT EXISTS "postgis";
        CREATE EXTENSION IF NOT EXISTS "pg_trgm";
        CREATE EXTENSION IF NOT EXISTS "btree_gist";
        CREATE EXTENSION IF NOT EXISTS "vector";
    EOSQL
    psql --username "$POSTGRES_USER" --dbname account_db <<-EOSQL
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        CREATE EXTENSION IF NOT EXISTS "pgcrypto";
