apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: account-service
    app.kubernetes.io/managed-by: kustomize
    environment: dev
    managed-by: gitops
    provider: hetzner
  name: account-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: AccountRecovery__RequireConfirmedEmail
              value: "false"
            - name: AccountRecovery__WebBaseUrl
              value: https://CRIBSTOP_DOMAIN_PLACEHOLDER
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ACCOUNT_DB_HOST
              value: postgres-svc
            - name: ACCOUNT_DB_PORT
              value: "5432"
            - name: ACCOUNT_DB_NAME
              value: account_db
            - name: ACCOUNT_DB_USER
              value: account_service_db_user
            - name: ACCOUNT_SERVICE_DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: ACCOUNT_SERVICE_DB_USER_PASSWORD
                  name: postgres-secret
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/account-service:dev
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /account/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          name: api
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /account/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          startupProbe:
            failureThreshold: 12
            httpGet:
              path: /account/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
      initContainers:
        - command:
            - dotnet
            - account-service.dll
            - --migrate-only
          env:
            - name: ACCOUNT_DB_HOST
              value: postgres-svc
            - name: ACCOUNT_DB_PORT
              value: "5432"
            - name: ACCOUNT_DB_NAME
              value: account_db
            - name: ACCOUNT_DB_USER
              value: account_service_db_user
            - name: ACCOUNT_SERVICE_DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: ACCOUNT_SERVICE_DB_USER_PASSWORD
                  name: postgres-secret
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/account-service:dev
          imagePullPolicy: Always
          name: migrate
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
