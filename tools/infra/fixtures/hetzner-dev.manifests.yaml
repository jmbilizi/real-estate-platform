apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: redis
    app.kubernetes.io/managed-by: kustomize
    environment: dev
    managed-by: gitops
    provider: hetzner
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  serviceName: redis-hl
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - command:
            - redis-server
            - /etc/redis/redis.conf
          env:
            - name: MAXMEMORY
              value: 128mb
            - name: REDIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_ADMIN_PASSWORD
                  name: redis-secret
            - name: REDIS_PUBSUB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_PUBSUB_PASSWORD
                  name: redis-secret
            - name: REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_CACHE_PASSWORD
                  name: redis-secret
            - name: REDIS_RATELIMIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_RATELIMIT_PASSWORD
                  name: redis-secret
            - name: REDIS_MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_MONITOR_PASSWORD
                  name: redis-secret
          image: valkey/valkey:9.0-alpine
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --user admin --pass "$REDIS_ADMIN_PASSWORD" ping | grep PONG
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: redis
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --user admin --pass "$REDIS_ADMIN_PASSWORD" ping | grep PONG
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - mountPath: /data
              name: redis-data
            - mountPath: /tmp/redis-config
              name: redis-config
              readOnly: true
            - mountPath: /etc/redis
              name: redis-acl
      initContainers:
        - command:
            - sh
            - -c
            - |
              # Copy redis.conf to /etc/redis
              cp /tmp/redis-config/redis.conf /etc/redis/redis.conf

              # Manual substitution using sed (no envsubst needed)
              sed -e "s|\${REDIS_ADMIN_PASSWORD}|${REDIS_ADMIN_PASSWORD}|g" \
                  -e "s|\${REDIS_PUBSUB_PASSWORD}|${REDIS_PUBSUB_PASSWORD}|g" \
                  -e "s|\${REDIS_CACHE_PASSWORD}|${REDIS_CACHE_PASSWORD}|g" \
                  -e "s|\${REDIS_RATELIMIT_PASSWORD}|${REDIS_RATELIMIT_PASSWORD}|g" \
                  -e "s|\${REDIS_MONITOR_PASSWORD}|${REDIS_MONITOR_PASSWORD}|g" \
                  /tmp/redis-config/users.acl > /etc/redis/users.acl

              # Set correct ownership and permissions for redis user (999)
              chown 999:999 /etc/redis/redis.conf /etc/redis/users.acl
              chmod 644 /etc/redis/redis.conf /etc/redis/users.acl
              echo "Redis config and ACL file generated successfully"
          env:
            - name: REDIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_ADMIN_PASSWORD
                  name: redis-secret
            - name: REDIS_PUBSUB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_PUBSUB_PASSWORD
                  name: redis-secret
            - name: REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_CACHE_PASSWORD
                  name: redis-secret
            - name: REDIS_RATELIMIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_RATELIMIT_PASSWORD
                  name: redis-secret
            - name: REDIS_MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_MONITOR_PASSWORD
                  name: redis-secret
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          name: acl-config
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /tmp/redis-config
              name: redis-config
              readOnly: true
            - mountPath: /etc/redis
              name: redis-acl
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            name: redis-config
          name: redis-config
        - emptyDir: {}
          name: redis-acl
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: hcloud-volumes
