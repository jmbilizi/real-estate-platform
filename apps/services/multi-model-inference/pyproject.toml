[tool.coverage.run]
branch = true
source = [ "multi_model_inference" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../coverage/apps/services/multi-model-inference/html'
 --cov-report xml:'../../../coverage/apps/services/multi-model-inference/coverage.xml'
 --html='../../../reports/apps/services/multi-model-inference/unittests/html/index.html'
 --junitxml='../../../reports/apps/services/multi-model-inference/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "multi_model_inference" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 88
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "multi-model-inference"
version = "1.0.0"
description = "Multi-model inference service powered by FastAPI."
requires-python = ">=3.9,<4"
readme = "README.md"
dependencies = [
  "fastapi>=0.115.0",
  "fastembed>=0.7.4",
  "pydantic-settings>=2.11.0",
  "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"
