# Skaffold Configuration for Real Estate Platform
# https://skaffold.dev/docs/references/yaml/
#
# Two modules in one file:
#   - services: gateway, services, infrastructure (manifests + deploy + port-forwards)
#   - clients:  frontend apps (requires services)
#
# Full stack:    skaffold dev (runs both modules)
# Backend only:  skaffold dev --module services
#
# Relationship with Nx:
# - Local dev: Skaffold watches files directly (bypasses Nx for speed)
# - CI/CD: Use an Nx-driven profile in the future to leverage caching/affected detection

# ═══════════════════════════════════════════════════════════════════════════════
# Module: services — gateway, services, and shared infrastructure
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: services

build:
  tagPolicy:
    gitCommit:
      variant: AbbrevCommitSha

  artifacts:
    - image: api-gateway
      context: .
      custom:
        buildCommand: node tools/infra/skaffold-build.js
        dependencies:
          paths:
            - apps/api-gateway/**
          ignore:
            - apps/api-gateway/bin/**
            - apps/api-gateway/obj/**
            - apps/api-gateway/Tests/**
            - apps/api-gateway/TestResults/**
      sync:
        manual:
          - src: apps/api-gateway/GeoLite2-City.mmdb
            dest: /opt/geoip/GeoLite2-City.mmdb
            strip: apps/api-gateway/

    - image: inference-service
      context: .
      custom:
        buildCommand: node tools/infra/skaffold-build.js
        dependencies:
          paths:
            - apps/services/multi-model-inference/**
          ignore:
            - apps/services/multi-model-inference/**/__pycache__/**
            - apps/services/multi-model-inference/**/*.pyc
            - apps/services/multi-model-inference/**/*.pyo
            - apps/services/multi-model-inference/.venv/**
            - apps/services/multi-model-inference/.pytest_cache/**
            - apps/services/multi-model-inference/.mypy_cache/**

    - image: account-service
      context: .
      custom:
        buildCommand: node tools/infra/skaffold-build.js
        dependencies:
          paths:
            - apps/services/account-service/**
          ignore:
            - apps/services/account-service/bin/**
            - apps/services/account-service/obj/**
            - apps/services/account-service/Tests/**
            - apps/services/account-service/TestResults/**

    - image: property-service
      context: .
      custom:
        buildCommand: node tools/infra/skaffold-build.js
        dependencies:
          paths:
            - apps/services/property-service/**
            - libs/listing-contracts/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
          ignore:
            - apps/services/property-service/node_modules/**
            - apps/services/property-service/tests/**

    # PostgreSQL 18 + PostGIS + pgvector. Built here rather than pulled because no trusted public
    # image carries both extensions — see infra/docker/postgres/Dockerfile.
    - image: postgres-postgis-pgvector
      context: .
      custom:
        buildCommand: node tools/infra/skaffold-build.js
        dependencies:
          paths:
            - infra/docker/postgres/**

  local:
    # IMPORTANT: This must be true for the Podman+Kind workflow.
    # - The cluster pulls from the local registry (localhost:5001)
    # - Skaffold will resolve the image digest from the registry
    # - The digest change updates the Deployment and triggers a rollout
    push: true
    useBuildkit: false
    concurrency: 0

manifests:
  kustomize:
    paths:
      - infra/k8s/podman/local
    buildArgs:
      - --enable-alpha-plugins

deploy:
  kubectl: {}

portForward:
  - resourceType: service
    resourceName: api-gateway-svc
    namespace: default
    port: 8080
    localPort: 8080
  - resourceType: service
    resourceName: property-service-svc
    namespace: default
    port: 3002
    localPort: 3002
  - resourceType: service
    resourceName: postgres-svc
    namespace: default
    port: 5432
    localPort: 5432
  - resourceType: service
    resourceName: redis-svc
    namespace: default
    port: 6379
    localPort: 6379
  - resourceType: service
    resourceName: jaeger-svc
    namespace: default
    port: 16686
    localPort: 16686

profiles:
  - name: services-only
    manifests:
      kustomize:
        paths:
          - infra/k8s/podman/.generated/services-only
        buildArgs:
          - --enable-alpha-plugins

---
# ═══════════════════════════════════════════════════════════════════════════════
# Module: clients — frontend apps (add new client apps here)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: clients
requires:
  - configs: [services]

build:
  tagPolicy:
    gitCommit:
      variant: AbbrevCommitSha

  artifacts:
    - image: cribstop-web
      context: .
      custom:
        buildCommand: node tools/infra/skaffold-build.js
        dependencies:
          paths:
            - apps/clients/cribstop/next/**
            - libs/listing-contracts/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
          ignore:
            - apps/clients/cribstop/next/node_modules/**
            - apps/clients/cribstop/next/.next/**
            - apps/clients/cribstop/next/.turbo/**

  local:
    push: true
    useBuildkit: false
    concurrency: 0

portForward:
  - resourceType: service
    resourceName: cribstop-web-svc
    namespace: default
    port: 3000
    localPort: 3000
