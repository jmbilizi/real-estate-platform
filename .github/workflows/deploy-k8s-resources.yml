name: Deploy K8s Resources

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      deploy_strategy:
        description: "Deployment strategy"
        required: false
        type: choice
        default: all
        options:
          - all # Deploy all services
          - single # Deploy specific services only
      services:
        description: "Comma-separated services to deploy (when strategy=single)"
        required: false
        type: string
        default: "all"
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      deploy_strategy:
        required: false
        type: string
        default: all
      services:
        required: false
        type: string
        default: "all"

jobs:
  deploy:
    # Single matrix-driven job. Matrix expands to exactly ONE environment
    # (the one the caller selected), so this replaces three near-identical
    # deploy-{dev,test,prod} jobs. `environment: ${{ matrix.environment }}`
    # ensures environment-scoped secrets still resolve per-env.
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          - ${{ github.event.inputs.environment || inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load deployment control
        id: deploy-control
        uses: ./.github/actions/load-deploy-control
        with:
          environment: ${{ matrix.environment }}
          deploy_strategy: ${{ github.event.inputs.deploy_strategy || inputs.deploy_strategy || 'all' }}
          services: ${{ github.event.inputs.services || inputs.services || 'all' }}

      # #219: blocks the prod deploy while draft legal copy (`isDraft: true`) is still live.
      # Reuses check-legal-content.js from #157, gated here at deploy time rather than build
      # time, because CI=true and NEXT_BUILD_STANDALONE=1 are set the same way in every
      # environment and cannot tell a prod build apart from dev or test. Runs via bare `node`,
      # the same pattern as `tools/infra/deploy-scope.js` below: the script has no npm
      # dependencies, so it needs no `pnpm install` step in this job.
      - name: Block deploy on draft legal content
        if: matrix.environment == 'prod' && steps.deploy-control.outputs.deploy_allowed == 'true'
        run: node apps/clients/cribstop/next/scripts/check-legal-content.js
        env:
          DEPLOYMENT_ENV: prod

      - name: Deploy K8s Resources (DRY composite)
        if: steps.deploy-control.outputs.deploy_allowed == 'true'
        uses: ./.github/actions/deploy-k8s-resources
        with:
          kustomizePath: infra/k8s/hetzner/${{ matrix.environment }}
          kubeconfig: ${{ secrets.KUBECONFIG }}
          deployStrategy: ${{ steps.deploy-control.outputs.deploy_strategy }}
          services: ${{ steps.deploy-control.outputs.deploy_services }}
          statefulset_timeout: ${{ steps.deploy-control.outputs.statefulset_timeout }}
          deployment_timeout: ${{ steps.deploy-control.outputs.deployment_timeout }}
          daemonset_timeout: ${{ steps.deploy-control.outputs.daemonset_timeout }}
          rollback_on_failure: ${{ steps.deploy-control.outputs.rollback_on_failure }}
          statefulset_rollback: ${{ steps.deploy-control.outputs.statefulset_rollback }}
        env:
          POSTGRES_SA_PASSWORD: ${{ secrets.POSTGRES_SA_PASSWORD }}
          ACCOUNT_SERVICE_DB_USER_PASSWORD: ${{ secrets.ACCOUNT_SERVICE_DB_USER_PASSWORD }}
          MESSAGING_SERVICE_DB_USER_PASSWORD: ${{ secrets.MESSAGING_SERVICE_DB_USER_PASSWORD }}
          PROPERTY_SERVICE_DB_USER_PASSWORD: ${{ secrets.PROPERTY_SERVICE_DB_USER_PASSWORD }}
          # Bright MLS ingestion (#91). Environment-scoped by `environment: ${{ matrix.environment }}`.
          # BRIGHT_MLS_ENV (`test` or `production`) states which tier the client credential belongs
          # to; any environment may hold either. Unset keeps the committed placeholder.
          BRIGHT_MLS_ENV: ${{ secrets.BRIGHT_MLS_ENV }}
          BRIGHT_MLS_CLIENT_ID: ${{ secrets.BRIGHT_MLS_CLIENT_ID }}
          BRIGHT_MLS_CLIENT_SECRET: ${{ secrets.BRIGHT_MLS_CLIENT_SECRET }}
          # Postmark transactional email (#175). One variable name for every environment.
          # `environment: ${{ matrix.environment }}` above scopes the lookup to that environment's
          # secrets, which is the control that keeps prod's live sender out of a dev or test run:
          # dev and test hold a Postmark sandbox token, prod holds the only live one (#133). No
          # repository secret of this name exists, so GitHub has no fallback to resolve.
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          REDIS_ADMIN_PASSWORD: ${{ secrets.REDIS_ADMIN_PASSWORD }}
          REDIS_PUBSUB_PASSWORD: ${{ secrets.REDIS_PUBSUB_PASSWORD }}
          REDIS_CACHE_PASSWORD: ${{ secrets.REDIS_CACHE_PASSWORD }}
          REDIS_RATELIMIT_PASSWORD: ${{ secrets.REDIS_RATELIMIT_PASSWORD }}
          REDIS_MONITOR_PASSWORD: ${{ secrets.REDIS_MONITOR_PASSWORD }}
          JAEGER_DOMAIN: ${{ secrets.JAEGER_DOMAIN }}
          API_GATEWAY_DOMAIN: ${{ secrets.API_GATEWAY_DOMAIN }}
          CRIBSTOP_DOMAIN: ${{ secrets.CRIBSTOP_DOMAIN }}
          # Shared basic-auth gate (#255): one credential per environment, gates jaeger,
          # api-gateway, and the dev/test cribstop-web Ingress. Same name locally and in
          # CI by design (tools/infra/secret-keys.js derives INGRESS_AUTH either way).
          INGRESS_AUTH: ${{ secrets.INGRESS_AUTH }}
