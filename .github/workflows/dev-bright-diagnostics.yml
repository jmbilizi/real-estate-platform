name: Dev Bright Diagnostics

# #378: engineers have no dev kubeconfig. This workflow is the only access path to dev's
# Postgres and the bright-sync-worker admin endpoint, using the `KUBECONFIG` secret already
# scoped to the GitHub `dev` environment for deploy-k8s-resources.yml.
#
# `workflow_dispatch` only runs from the default branch (dev). The first run needs this file
# merged first.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Diagnostic action"
        required: true
        type: choice
        default: report
        options:
          - report
          - backfill
          - reconcile
          - audit
          - field-probe

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -Ls https://dl.k8s.io/release/stable.txt || echo "v1.31.0")
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get ns default >/dev/null

      # ── report: read-only, no admin token needed ─────────────────────────────────────────
      - name: Report — image tags and pod status
        if: inputs.action == 'report'
        run: |
          {
            echo "## Bright diagnostics: images and pods"
            echo ""
            echo "### Image tags"
            echo '```'
            kubectl get deployment property-service -n default \
              -o jsonpath='property-service: {.spec.template.spec.containers[0].image}{"\n"}'
            kubectl get deployment bright-sync-worker -n default \
              -o jsonpath='bright-sync-worker: {.spec.template.spec.containers[0].image}{"\n"}'
            echo '```'
            echo ""
            echo "### Pod restarts and age"
            echo '```'
            kubectl get pods -n default -l 'app in (property-service,bright-sync-worker)' \
              -o custom-columns='POD:.metadata.name,RESTARTS:.status.containerStatuses[0].restartCount,AGE:.metadata.creationTimestamp'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait for postgres-0
        if: inputs.action == 'report'
        run: kubectl wait pod/postgres-0 -n default --for=condition=Ready --timeout=120s

      - name: Report — bright_sync_runs and listing_search_v
        if: inputs.action == 'report'
        run: |
          # DB owner comes from the pod's own env, never a workflow secret — the same
          # pattern deploy-k8s-resources.yml uses to run init-databases.sh / sync-passwords.sh.
          run_query() {
            kubectl exec postgres-0 -n default -- \
              psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname property_db -c "$1"
          }
          exec_query() {
            kubectl exec postgres-0 -n default -- bash -c \
              'psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname property_db -c "'"$1"'"'
          }
          {
            echo ""
            echo "### Last 15 bright_sync_runs"
            echo '```'
            exec_query "select mode, status, started_at, finished_at, counts, error from bright_sync_runs order by started_at desc limit 15;"
            echo '```'
            echo ""
            echo "### listing_search_v: DC sale counts by status"
            echo '```'
            exec_query "select status, count(*) from listing_search_v where lower(city)='"'"'washington'"'"' and state='"'"'DC'"'"' and listing_type='"'"'sale'"'"' group by status order by status;"
            echo '```'
            echo ""
            echo "### listing_search_v: whole-table counts by status"
            echo '```'
            exec_query "select status, count(*) from listing_search_v group by status order by status;"
            echo '```'
            echo ""
            echo "### is_sample = true listings, by source and listing_type"
            echo '```'
            exec_query "select source, listing_type, count(*) from listings where is_sample = true group by source, listing_type order by source, listing_type;"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report — bright-sync-worker log tail
        if: inputs.action == 'report'
        run: |
          {
            echo ""
            echo "### bright-sync-worker log tail (200 lines)"
            echo '```'
            kubectl logs deployment/bright-sync-worker -n default --tail=200
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ── field-probe: read-only, uses the worker pod's own Bright credential, no admin token ──
      - name: Field probe — RESO on-market timestamp candidates (#459)
        if: inputs.action == 'field-probe'
        run: |
          cat > /tmp/probe.js <<'PROBE_EOF'
          // Read-only field-fill probe. Never writes, never logs credentials or full bodies.
          // Duplicates the minimal token+query shape already confirmed in bright-client.ts /
          // resources.ts rather than importing the built worker, so this has zero blast radius
          // on the running sync job.
          const FEEDS = {
            test: {
              tokenEndpoint: 'https://okta.tst.brightmls.com/oauth2/default/v1/token',
              serviceRoot: 'https://bright-reso.tst.brightmls.com/RESO/OData/bright',
            },
            production: {
              tokenEndpoint: 'https://okta.brightmls.com/oauth2/default/v1/token',
              serviceRoot: 'https://bright-reso.brightmls.com/RESO/OData/bright',
            },
          };

          async function main() {
            const tier = (process.env.BRIGHT_MLS_ENV || '').trim();
            const clientId = (process.env.BRIGHT_MLS_CLIENT_ID || '').trim();
            const clientSecret = (process.env.BRIGHT_MLS_CLIENT_SECRET || '').trim();
            if (tier !== 'test' && tier !== 'production') {
              console.log(`BRIGHT_MLS_ENV is not a recognised tier (got: ${tier || '<empty>'})`);
              process.exit(1);
            }
            if (!clientId || !clientSecret || clientId === 'StrongBase64Password') {
              console.log('Bright credentials not configured in this environment.');
              process.exit(1);
            }
            const { tokenEndpoint, serviceRoot } = FEEDS[tier];
            console.log(`Feed tier: ${tier}`);

            const tokenRes = await fetch(tokenEndpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'client_credentials',
                client_id: clientId,
                client_secret: clientSecret,
              }).toString(),
            });
            if (!tokenRes.ok) {
              console.log(`Token request failed: HTTP ${tokenRes.status}`);
              process.exit(1);
            }
            const { access_token: token } = await tokenRes.json();

            const fields = [
              'ListingKey',
              'StandardStatus',
              'MLSListDate',
              'OnMarketTimestamp',
              'StatusChangeTimestamp',
              'MajorChangeTimestamp',
              'ModificationTimestamp',
            ];
            const select = fields.join(',');
            const url =
              `${serviceRoot}/BrightProperties?$select=${select}` +
              `&$filter=StandardStatus eq 'Active'&$orderby=ModificationTimestamp desc&$top=200`;

            const pageRes = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            if (!pageRes.ok) {
              const body = await pageRes.text();
              console.log(`Page request failed: HTTP ${pageRes.status} — ${body.slice(0, 300)}`);
              process.exit(1);
            }
            const page = await pageRes.json();
            const records = page.value || [];
            console.log(`Sampled ${records.length} Active records (ordered by ModificationTimestamp desc).`);

            const fillCounts = Object.fromEntries(fields.map((f) => [f, 0]));
            const sample = [];
            for (const rec of records) {
              for (const f of fields) {
                if (rec[f] !== null && rec[f] !== undefined && rec[f] !== '') {
                  fillCounts[f] += 1;
                }
              }
              if (sample.length < 5) {
                sample.push({
                  ListingKey: rec.ListingKey,
                  MLSListDate: rec.MLSListDate,
                  OnMarketTimestamp: rec.OnMarketTimestamp,
                  StatusChangeTimestamp: rec.StatusChangeTimestamp,
                  MajorChangeTimestamp: rec.MajorChangeTimestamp,
                });
              }
            }

            console.log('\nFill rate over the sample:');
            for (const f of fields) {
              const pct = records.length ? ((fillCounts[f] / records.length) * 100).toFixed(1) : '0.0';
              console.log(`  ${f}: ${fillCounts[f]}/${records.length} (${pct}%)`);
            }

            console.log('\nFirst 5 records (key fields only):');
            for (const rec of sample) {
              console.log(JSON.stringify(rec));
            }
          }

          main().catch((err) => {
            console.log(`Probe failed: ${err && err.message ? err.message : String(err)}`);
            process.exit(1);
          });
          PROBE_EOF
          {
            echo "## Bright field probe: on-market timestamp candidates"
            echo ""
            echo '```'
            kubectl exec -i deployment/bright-sync-worker -n default -- node < /tmp/probe.js
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ── backfill / reconcile / audit: call the admin endpoint on property-service ───────
      - name: Mask admin token
        if: contains(fromJSON('["backfill","reconcile","audit"]'), inputs.action)
        run: |
          TOKEN=$(kubectl get secret bright-mls-secret -n default -o jsonpath='{.data.BRIGHT_ADMIN_TOKEN}' | base64 -d)
          echo "::add-mask::$TOKEN"
          echo "BRIGHT_ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Port-forward to property-service
        if: contains(fromJSON('["backfill","reconcile","audit"]'), inputs.action)
        run: |
          kubectl port-forward svc/property-service-svc 3002:3002 -n default &
          echo "PF_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            curl -sf http://localhost:3002/health >/dev/null && break
            sleep 1
          done

      - name: Trigger Bright sync run
        if: contains(fromJSON('["backfill","reconcile","audit"]'), inputs.action)
        run: |
          MODE="${{ inputs.action }}"
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST http://localhost:3002/admin/bright/sync \
            -H "Authorization: Bearer $BRIGHT_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"mode\":\"$MODE\"}")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          {
            echo "## Bright sync run requested: $MODE"
            echo ""
            echo "HTTP status: $STATUS"
            echo '```json'
            echo "$BODY"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" -ge 300 ]; then
            echo "Admin endpoint returned $STATUS" >&2
            exit 1
          fi

      - name: Stop port-forward
        if: always() && contains(fromJSON('["backfill","reconcile","audit"]'), inputs.action)
        run: |
          [ -n "$PF_PID" ] && kill "$PF_PID" 2>/dev/null || true
