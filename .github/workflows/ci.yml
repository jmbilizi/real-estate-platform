# CI Workflow
# Primary push/PR trigger for quality checks.
# After CI completes successfully, triggers provision/deploy workflows based on changed files.
# This ensures CI always runs first and only relevant workflows are triggered.
name: CI

on:
  push:
    branches:
      - main
      - test
      - dev
  pull_request:
    branches:
      - main
      - test
      - dev
  workflow_call: # Allow other workflows to call CI

permissions:
  actions: write # Required to trigger provision/deploy/build-images workflows
  contents: read
  packages: write # Required for container image pushes

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Enable Nx affected commands

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check workspace formatting
        run: npm run nx:workspace-format-check

  node:
    needs: setup-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Cache Nx cache directory for faster builds
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/requirements.txt', '**/*.csproj') }}
          restore-keys: |
            nx-${{ runner.os }}-

      # Note: We do NOT run nx:reset in CI to ensure we validate code exactly as committed.
      # If project tags or workspace state is incorrect, CI should fail (not auto-fix).
      # Developers should run 'npm run check' locally before pushing.

      - name: Check Node.js formatting (PR - affected only)
        if: github.event_name == 'pull_request'
        run: npx nx format:check --base=origin/${{ github.base_ref }} --head=HEAD --projects=tag:runtime:node || echo "No affected Node.js projects"

      - name: Check Node.js formatting (Push - all projects)
        if: github.event_name == 'push'
        run: npx nx format:check --projects=tag:runtime:node || echo "No Node.js projects found"

      - name: Lint Node.js projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: npx nx affected --base=origin/${{ github.base_ref }} --head=HEAD --target=lint --projects=tag:runtime:node || echo "No affected Node.js projects"

      - name: Lint Node.js projects (Push - all projects)
        if: github.event_name == 'push'
        run: npm run nx:node-lint || echo "No Node.js projects found"

      - name: Test Node.js projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: npx nx affected --base=origin/${{ github.base_ref }} --head=HEAD --target=test --projects=tag:runtime:node || echo "No affected Node.js projects"

      - name: Test Node.js projects (Push - all projects)
        if: github.event_name == 'push'
        run: npm run nx:node-test || echo "No Node.js projects found"

      - name: Build Node.js projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: npx nx affected --base=origin/${{ github.base_ref }} --head=HEAD --target=build --projects=tag:runtime:node || echo "No affected Node.js projects"

      - name: Build Node.js projects (Push - all projects)
        if: github.event_name == 'push'
        run: npm run nx:node-build || echo "No Node.js projects found"

      - name: Upload Node.js artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-node
          path: |
            dist/
            coverage/
            test-results/
          retention-days: 7

  python:
    needs: setup-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Cache UV
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Cache Nx cache directory for faster builds
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/requirements.txt', '**/*.csproj') }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Set up Python environment
        run: uv sync

      # Note: We do NOT run nx:reset in CI to ensure we validate code exactly as committed.
      # If project tags or workspace state is incorrect, CI should fail (not auto-fix).
      # Developers should run 'npm run check' locally before pushing.

      - name: Check Python formatting (PR - affected only)
        if: github.event_name == 'pull_request'
        run: uv run black --check . --exclude "(/\\.venv/|/node_modules/|/\\.git/|/\\.nx/|/__pycache__/|/dist/|/build/)" || echo "No affected Python projects"

      - name: Check Python formatting (Push - all projects)
        if: github.event_name == 'push'
        run: uv run black --check . --exclude "(/\\.venv/|/node_modules/|/\\.git/|/\\.nx/|/__pycache__/|/dist/|/build/)" || echo "No Python projects found"

      - name: Lint Python projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: npx nx affected --base=origin/${{ github.base_ref }} --head=HEAD --target=lint --projects=tag:runtime:python || echo "No affected Python projects"

      - name: Lint Python projects (Push - all projects)
        if: github.event_name == 'push'
        run: npm run nx:python-lint || echo "No Python projects found"

      - name: Test Python projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: npx nx affected --base=origin/${{ github.base_ref }} --head=HEAD --target=test --projects=tag:runtime:python || echo "No affected Python projects"

      - name: Test Python projects (Push - all projects)
        if: github.event_name == 'push'
        run: npm run nx:python-test || echo "No Python projects found"

      - name: Build Python projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: npx nx affected --base=origin/${{ github.base_ref }} --head=HEAD --target=build --projects=tag:runtime:python || echo "No affected Python projects"

      - name: Build Python projects (Push - all projects)
        if: github.event_name == 'push'
        run: npm run nx:python-build || echo "No Python projects found"

      - name: Upload Python artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-python
          path: |
            dist/
            coverage/
            test-results/
          retention-days: 7

  dotnet:
    needs: setup-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Cache Nx cache directory for faster builds
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/requirements.txt', '**/*.csproj') }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Set up .NET environment
        run: npm run dotnet:env

      # Restore NuGet packages to catch version conflicts early
      - name: Restore .NET packages
        run: dotnet restore || echo "No .NET projects to restore"

      # Note: We do NOT run nx:reset in CI to ensure we validate code exactly as committed.
      # If project tags or workspace state is incorrect, CI should fail (not auto-fix).
      # Developers should run 'npm run check' locally before pushing.

      - name: Check .NET formatting (PR - affected only)
        if: github.event_name == 'pull_request'
        run: npx nx affected --base=origin/${{ github.base_ref }} --head=HEAD --target=format-check --projects=tag:runtime:dotnet || echo "No affected .NET projects"

      - name: Check .NET formatting (Push - all projects)
        if: github.event_name == 'push'
        run: npm run nx:dotnet-format-check || echo "No .NET projects found"

      - name: Lint .NET projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: npx nx affected --base=origin/${{ github.base_ref }} --head=HEAD --target=lint --projects=tag:runtime:dotnet || echo "No affected .NET projects"

      - name: Lint .NET projects (Push - all projects)
        if: github.event_name == 'push'
        run: npm run nx:dotnet-lint || echo "No .NET projects found"

      - name: Type check .NET projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: npx nx affected --base=origin/${{ github.base_ref }} --head=HEAD --target=type-check --projects=tag:runtime:dotnet || echo "No affected .NET projects"

      - name: Type check .NET projects (Push - all projects)
        if: github.event_name == 'push'
        run: npm run nx:dotnet-type-check || echo "No .NET projects found"

      - name: Test .NET projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: npx nx affected --base=origin/${{ github.base_ref }} --head=HEAD --target=test --projects=tag:runtime:dotnet || echo "No affected .NET projects"

      - name: Test .NET projects (Push - all projects)
        if: github.event_name == 'push'
        run: npm run nx:dotnet-test || echo "No .NET projects found"

      - name: Build .NET projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: npx nx affected --base=origin/${{ github.base_ref }} --head=HEAD --target=build --projects=tag:runtime:dotnet || echo "No affected .NET projects"

      - name: Build .NET projects (Push - all projects)
        if: github.event_name == 'push'
        run: npm run nx:dotnet-build || echo "No .NET projects found"

      - name: Upload .NET artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-dotnet
          path: |
            dist/
            coverage/
            test-results/
          retention-days: 7
  # Detect which infrastructure workflows need to be triggered
  detect-infra-changes:
    needs: [node, python, dotnet] # Wait for all quality checks to pass
    if: github.event_name == 'push' # Only trigger workflows on push, not PR
    runs-on: ubuntu-latest
    outputs:
      cluster-changed: ${{ steps.detect.outputs.cluster-changed }}
      deploy-changed: ${{ steps.detect.outputs.deploy-changed }}
      images-changed: ${{ steps.detect.outputs.images-changed }}
      branch: ${{ steps.detect.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Need HEAD and HEAD^ for diff

      - name: Detect infrastructure changes
        id: detect
        shell: bash
        run: |
          # Get changed files between HEAD^ and HEAD
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            FILES=$(git diff --name-only HEAD^ HEAD)
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi

          echo "Changed files:"
          echo "$FILES"

          cluster=false
          deploy=false
          images=false

          # Check for cluster configuration changes
          if echo "$FILES" | grep -E -q '^infra/k8s/hetzner/.*/cluster/|^\.github/workflows/provision-hetzner-k8s-cluster\.yml|^\.github/actions/provision-hetzner-k8s-cluster/'; then
            cluster=true
            echo "✅ Cluster configuration changes detected"
          fi

          # Check for deploy resource changes (excluding cluster paths)
          if echo "$FILES" | grep -E -q '^infra/k8s/base/|^infra/deploy-control\.yaml|^infra/smart-deployment-config\.yaml|^infra/k8s/hetzner/.*/patches/|^\.github/workflows/deploy-k8s-resources\.yml|^\.github/actions/deploy-k8s-resources/|^\.github/workflows/ci\.yml'; then
            deploy=true
            echo "✅ Deploy resource changes detected"
          fi

          # Check for container image changes (Dockerfile, source code, build scripts)
          if echo "$FILES" | grep -E -q '^apps/.*/Dockerfile|^apps/.*\.(cs|ts|py|js)$|^libs/|^tools/docker/|^\.github/workflows/build-push-images\.yml|^\.github/actions/build-push-image/'; then
            images=true
            echo "✅ Container image changes detected"
          fi

          # Determine environment based on branch
          BRANCH="${{ github.ref_name }}"

          echo "cluster-changed=$cluster" >> $GITHUB_OUTPUT
          echo "deploy-changed=$deploy" >> $GITHUB_OUTPUT
          echo "images-changed=$images" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

  # Trigger cluster provisioning workflow if cluster configs changed
  trigger-provision:
    needs: [detect-infra-changes]
    if: needs.detect-infra-changes.outputs.cluster-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Determine environment from branch
        id: env
        run: |
          BRANCH="${{ needs.detect-infra-changes.outputs.branch }}"
          if [ "$BRANCH" = "main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "test" ]; then
            echo "environment=test" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Trigger cluster provisioning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🚀 Triggering cluster provisioning for ${{ steps.env.outputs.environment }} environment..."
          gh workflow run provision-hetzner-k8s-cluster.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            --field environment=${{ steps.env.outputs.environment }}
          echo "✅ Cluster provisioning workflow triggered"

  # Trigger container image build workflow if source code changed
  trigger-image-build:
    needs: [detect-infra-changes]
    if: needs.detect-infra-changes.outputs.images-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Determine environment from branch
        id: env
        run: |
          BRANCH="${{ needs.detect-infra-changes.outputs.branch }}"
          if [ "$BRANCH" = "main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "test" ]; then
            echo "environment=test" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Trigger image build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🐳 Triggering container image build for ${{ steps.env.outputs.environment }} environment..."
          gh workflow run build-push-images.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            --field environment=${{ steps.env.outputs.environment }} \
            --field projects=affected \
            --field push=true
          echo "✅ Image build workflow triggered"

  # Trigger deploy workflow if ONLY deploy resources changed (not images)
  # If images also changed, build-push-images workflow will trigger deploy after images are ready
  trigger-deploy:
    needs: [detect-infra-changes]
    if: |
      needs.detect-infra-changes.outputs.deploy-changed == 'true' &&
      needs.detect-infra-changes.outputs.cluster-changed != 'true' &&
      needs.detect-infra-changes.outputs.images-changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Detect changed services
        id: detect-services
        shell: bash
        run: |
          # Get changed files
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            FILES=$(git diff --name-only HEAD^ HEAD)
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi

          echo "Changed files:"
          echo "$FILES"

          # Determine environment from branch
          BRANCH="${{ needs.detect-infra-changes.outputs.branch }}"
          if [ "$BRANCH" = "main" ]; then
            ENV="prod"
          elif [ "$BRANCH" = "test" ]; then
            ENV="test"
          else
            ENV="dev"
          fi

          echo "Target environment: $ENV"

          # Load smart-deployment-config.yaml configuration
          CONFIG_FILE="infra/smart-deployment-config.yaml"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Configuration file not found: $CONFIG_FILE"
            exit 1
          fi

          # Extract global triggers from config
          GLOBAL_TRIGGERS=$(yq -r '.global_triggers.paths[]' "$CONFIG_FILE" | paste -sd '|' -)

          # Extract ignored paths from config
          IGNORED_PATHS=$(yq -r '.ignored_paths.paths[]' "$CONFIG_FILE" | paste -sd '|' -)

          # Check for global triggers (files that affect all services)
          if echo "$FILES" | grep -E -q "$GLOBAL_TRIGGERS"; then
            echo "deploy_strategy=all" >> $GITHUB_OUTPUT
            echo "services=all" >> $GITHUB_OUTPUT
            echo "environment=$ENV" >> $GITHUB_OUTPUT
            echo "🚨 Global trigger detected - deploying ALL services to $ENV"
            exit 0
          fi

          # Check for ignored paths (documentation only)
          if [ -n "$IGNORED_PATHS" ] && echo "$FILES" | grep -E -q "$IGNORED_PATHS"; then
            # Filter out ignored files
            FILES=$(echo "$FILES" | grep -v -E "$IGNORED_PATHS")
            if [ -z "$FILES" ]; then
              echo "deploy_strategy=none" >> $GITHUB_OUTPUT
              echo "services=" >> $GITHUB_OUTPUT
              echo "environment=$ENV" >> $GITHUB_OUTPUT
              echo "ℹ️  Only ignored files changed - skipping deployment"
              exit 0
            fi
          fi

          # Detect affected services by checking each service's resource paths
          affected_services=""

          # Get list of all services from config
          SERVICES=$(yq -r '.services | keys[]' "$CONFIG_FILE")

          for service in $SERVICES; do
            echo "Checking service: $service"
            
            # Get all resource paths for this service and convert wildcards to regex
            RESOURCE_PATHS=$(yq -r ".services.$service.resources[]" "$CONFIG_FILE" | while read -r path; do
              # Replace ** with .* for regex matching
              # Replace * with [^/]* for single-level wildcard
              # Escape dots
              echo "$path" | sed 's|\*\*|.*|g; s|\*|[^/]*|g; s|\.|\\.|g'
            done | paste -sd '|' -)
            
            # Check if any changed files match this service's resource paths
            # Use environment-aware matching (only match files for current env or base/)
            if echo "$FILES" | grep -E -q "^($RESOURCE_PATHS)$"; then
              # Additional environment isolation check
              # If file is in a patch directory, verify it's for the correct environment
              ENV_FILES=$(echo "$FILES" | grep -E "^($RESOURCE_PATHS)$" | grep -E "infra/k8s/(hetzner|podman)/" || true)
              BASE_FILES=$(echo "$FILES" | grep -E "^($RESOURCE_PATHS)$" | grep -v -E "infra/k8s/(hetzner|podman)/" || true)
              
              # If we have env-specific files, check they match our target env
              if [ -n "$ENV_FILES" ]; then
                if echo "$ENV_FILES" | grep -E -q "/$ENV/"; then
                  echo "  ✅ Service affected (environment-specific change for $ENV)"
                  affected_services="$service,$affected_services"
                else
                  echo "  ⏭️  Skipping (change for different environment)"
                fi
              # If only base files changed, they affect this environment
              elif [ -n "$BASE_FILES" ]; then
                echo "  ✅ Service affected (base resource change)"
                affected_services="$service,$affected_services"
              fi
            fi
          done

          # Remove trailing comma
          affected_services=${affected_services%,}

          if [ -z "$affected_services" ]; then
            echo "deploy_strategy=none" >> $GITHUB_OUTPUT
            echo "services=" >> $GITHUB_OUTPUT
            echo "environment=$ENV" >> $GITHUB_OUTPUT
            echo "ℹ️  No K8s services affected in $ENV environment - skipping deployment"
          else
            echo "deploy_strategy=single" >> $GITHUB_OUTPUT
            echo "services=$affected_services" >> $GITHUB_OUTPUT
            echo "environment=$ENV" >> $GITHUB_OUTPUT
            echo "✅ Affected services in $ENV: $affected_services"
          fi

      - name: Trigger resource deployment
        if: steps.detect-services.outputs.deploy_strategy != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STRATEGY="${{ steps.detect-services.outputs.deploy_strategy }}"
          SERVICES="${{ steps.detect-services.outputs.services }}"
          ENV="${{ steps.detect-services.outputs.environment }}"

          if [ "$STRATEGY" = "all" ]; then
            echo "🚀 Triggering FULL deployment (all services) for $ENV environment..."
          else
            echo "🎯 Triggering TARGETED deployment for $ENV environment: $SERVICES"
          fi

          gh workflow run deploy-k8s-resources.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            --field environment="$ENV" \
            --field deploy_strategy="$STRATEGY" \
            --field services="$SERVICES"

          echo "✅ Deployment workflow triggered"
