# CI Workflow
# Primary push/PR trigger for quality checks.
# After CI completes successfully, triggers provision/deploy workflows based on changed files.
# This ensures CI always runs first and only relevant workflows are triggered.
name: CI

on:
  push:
    branches:
      - main
      - test
      - dev
  pull_request:
    branches:
      - main
      - test
      - dev
  # Weekly full-suite run on dev every Monday at 06:00 UTC.
  # Catches pre-existing issues (bad formatting, lint errors) in files that
  # haven't been touched recently and would be missed by affected-only checks.
  schedule:
    - cron: "0 6 * * 1"
  workflow_call: # Allow other workflows to call CI

permissions:
  actions: write # Required to trigger provision/deploy/build-images workflows
  contents: read
  packages: write # Required for container image pushes
  security-events: write # Required for Trivy scan upload in build-push-images

concurrency:
  group: ci-${{ github.ref }}
  # Cancel in-progress runs when a new push arrives. The latest commit builds;
  # intermediate commits are dropped. This prevents job queue exhaustion.
  cancel-in-progress: true

jobs:
  setup-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Enable Nx affected commands

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: "pnpm"

      # Cache node_modules so downstream jobs (node, python, dotnet) can restore it
      # and skip running pnpm install entirely.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Node.js dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check workspace formatting
        run: pnpm run nx:workspace-format-check

  detect-languages:
    needs: setup-base
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node == 'true' || steps.run-all.outputs.run_all == 'true' }}
      python: ${{ steps.filter.outputs.python == 'true' || steps.run-all.outputs.run_all == 'true' }}
      dotnet: ${{ steps.filter.outputs.dotnet == 'true' || steps.run-all.outputs.run_all == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Determine the base SHA for change detection.
      # For pushes: use the last SUCCESSFUL CI run's commit on this branch.
      # This ensures that after a failed run, the next push compares against
      # the last green state — not just the previous commit. Fixes the bug where
      # a fix push only touches .yml but the original failure was in .ts files,
      # causing the node job to be skipped entirely.
      - name: Determine comparison base
        id: run-all
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # First push, workflow_call, or schedule → run all
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || \
             [ "${{ github.event_name }}" = "workflow_call" ] || \
             [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run_all=true" >> $GITHUB_OUTPUT
            echo "base_sha=" >> $GITHUB_OUTPUT
            echo "ℹ️ First push / schedule / workflow_call → running all checks"
            exit 0
          fi

          # PRs always compare against the target branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "run_all=false" >> $GITHUB_OUTPUT
            echo "base_sha=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
            echo "ℹ️ PR → comparing against origin/${{ github.base_ref }}"
            exit 0
          fi

          # Push: find last successful CI run on this branch
          BRANCH="${{ github.ref_name }}"
          LAST_GREEN_SHA=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=${BRANCH}&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || echo "")

          if [ -z "$LAST_GREEN_SHA" ]; then
            echo "run_all=true" >> $GITHUB_OUTPUT
            echo "base_sha=" >> $GITHUB_OUTPUT
            echo "⚠️ No previous successful run found on ${BRANCH} → running all checks"
          elif ! git cat-file -e "$LAST_GREEN_SHA" 2>/dev/null; then
            echo "run_all=true" >> $GITHUB_OUTPUT
            echo "base_sha=" >> $GITHUB_OUTPUT
            echo "⚠️ Last green SHA ${LAST_GREEN_SHA} not in history → running all checks"
          else
            echo "run_all=false" >> $GITHUB_OUTPUT
            echo "base_sha=${LAST_GREEN_SHA}" >> $GITHUB_OUTPUT
            echo "✓ Comparing against last green: ${LAST_GREEN_SHA}"
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.run-all.outputs.run_all == 'false'
        with:
          base: ${{ steps.run-all.outputs.base_sha }}
          ref: ${{ github.sha }}
          filters: |
            node:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/package.json'
              - '**/tsconfig*.json'
              - 'pnpm-lock.yaml'
              - 'tools/node/**'
            python:
              - '**/*.py'
              - '**/*.pyx'
              - '**/*.pxd'
              - '**/*.pyi'
              - '**/*.ipynb'
              - '**/pyproject.toml'
              - 'uv.lock'
              - 'tools/python/**'
            dotnet:
              - '**/*.cs'
              - '**/*.vb'
              - '**/*.csproj'
              - '**/*.sln'
              - '**/*.fsproj'
              - '**/Directory.*.props'
              - '**/Directory.*.targets'
              - '**/nuget.config'
              - '**/global.json'
              - 'tools/dotnet/**'

  node:
    needs: [setup-base, detect-languages]
    if: needs.detect-languages.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: "pnpm"

      - name: Restore node_modules
        id: restore-node-modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Always run pnpm install to ensure workspace package node_modules are linked.
      # The root node_modules cache above speeds this up (no re-download of root deps),
      # but workspace packages (e.g. cribstop-next) have their own node_modules that
      # are NOT cached. pnpm install links them using the cached pnpm store (~5-10s).
      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      # Cache Nx cache directory for faster builds
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/requirements.txt', '**/*.csproj') }}
          restore-keys: |
            nx-${{ runner.os }}-

      # Note: We do NOT run nx:reset in CI to ensure we validate code exactly as committed.
      # If project tags or workspace state is incorrect, CI should fail (not auto-fix).
      # Developers should run 'pnpm run check' locally before pushing.
      # Note: workspace format check already ran in setup-base; no need to repeat it here.

      # PR steps use two-step approach: get affected projects first, then run-many.
      # Nx 22 bug: --affected/--base/--head flags get forwarded to executors (e.g. ESLint)
      # when passed directly to run-many. Using nx show projects avoids this entirely.
      - name: Lint Node.js projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: |
          PROJECTS=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref }} --head=HEAD --projects=tag:runtime:node --withTarget=lint 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          if [ -n "$PROJECTS" ]; then
            pnpm exec nx run-many --target=lint --projects="$PROJECTS"
          else
            echo "No affected Node.js projects with lint target"
          fi

      - name: Lint Node.js projects (Push - all projects)
        if: github.event_name != 'pull_request'
        run: pnpm run nx:node-lint

      - name: Test Node.js projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: |
          PROJECTS=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref }} --head=HEAD --projects=tag:runtime:node --withTarget=test 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          if [ -n "$PROJECTS" ]; then
            pnpm exec nx run-many --target=test --projects="$PROJECTS"
          else
            echo "No affected Node.js projects with test target"
          fi

      - name: Test Node.js projects (Push - all projects)
        if: github.event_name != 'pull_request'
        run: pnpm run nx:node-test

      - name: Build Node.js projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: |
          PROJECTS=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref }} --head=HEAD --projects=tag:runtime:node --withTarget=build 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          if [ -n "$PROJECTS" ]; then
            pnpm exec nx run-many --target=build --projects="$PROJECTS"
          else
            echo "No affected Node.js projects with build target"
          fi

      - name: Build Node.js projects (Push - all projects)
        if: github.event_name != 'pull_request'
        run: pnpm run nx:node-build

      - name: Upload Node.js artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-node
          path: |
            dist/
            coverage/
            test-results/
          retention-days: 7

  python:
    needs: [setup-base, detect-languages]
    if: needs.detect-languages.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Cache UV
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: "pnpm"

      - name: Restore node_modules
        id: restore-node-modules-python
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Fallback: install if cache miss
      - name: Install Node.js dependencies (fallback)
        if: steps.restore-node-modules-python.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Cache Nx cache directory for faster builds
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/requirements.txt', '**/*.csproj') }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Set up Python environment
        run: uv sync

      # Note: We do NOT run nx:reset in CI to ensure we validate code exactly as committed.
      # If project tags or workspace state is incorrect, CI should fail (not auto-fix).
      # Developers should run 'pnpm run check' locally before pushing.

      - name: Check Python formatting (PR - affected only)
        if: github.event_name == 'pull_request'
        run: uv run black --check . --exclude "(/\\.venv/|/node_modules/|/\\.git/|/\\.nx/|/__pycache__/|/dist/|/build/)"

      - name: Check Python formatting (Push - all projects)
        if: github.event_name != 'pull_request'
        run: uv run black --check . --exclude "(/\\.venv/|/node_modules/|/\\.git/|/\\.nx/|/__pycache__/|/dist/|/build/)"

      - name: Lint Python projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: |
          PROJECTS=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref }} --head=HEAD --projects=tag:runtime:python --withTarget=lint 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          if [ -n "$PROJECTS" ]; then
            pnpm exec nx run-many --target=lint --projects="$PROJECTS"
          else
            echo "No affected Python projects with lint target"
          fi

      - name: Lint Python projects (Push - all projects)
        if: github.event_name != 'pull_request'
        run: pnpm run nx:python-lint

      - name: Test Python projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: |
          PROJECTS=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref }} --head=HEAD --projects=tag:runtime:python --withTarget=test 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          if [ -n "$PROJECTS" ]; then
            pnpm exec nx run-many --target=test --projects="$PROJECTS"
          else
            echo "No affected Python projects with test target"
          fi

      - name: Test Python projects (Push - all projects)
        if: github.event_name != 'pull_request'
        run: pnpm run nx:python-test

      - name: Build Python projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: |
          PROJECTS=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref }} --head=HEAD --projects=tag:runtime:python --withTarget=build 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          if [ -n "$PROJECTS" ]; then
            pnpm exec nx run-many --target=build --projects="$PROJECTS"
          else
            echo "No affected Python projects with build target"
          fi

      - name: Build Python projects (Push - all projects)
        if: github.event_name != 'pull_request'
        run: pnpm run nx:python-build

      - name: Upload Python artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-python
          path: |
            dist/
            coverage/
            test-results/
          retention-days: 7

  dotnet:
    needs: [setup-base, detect-languages]
    if: needs.detect-languages.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: "pnpm"

      - name: Restore node_modules
        id: restore-node-modules-dotnet
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Fallback: install if cache miss
      - name: Install Node.js dependencies (fallback)
        if: steps.restore-node-modules-dotnet.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Cache Nx cache directory for faster builds
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/requirements.txt', '**/*.csproj') }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Set up .NET environment
        run: pnpm run dotnet:env

      # Note: We do NOT run nx:reset in CI to ensure we validate code exactly as committed.
      # If project tags or workspace state is incorrect, CI should fail (not auto-fix).
      # Developers should run 'pnpm run check' locally before pushing.

      - name: Check .NET formatting (PR - affected only)
        if: github.event_name == 'pull_request'
        run: |
          PROJECTS=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref }} --head=HEAD --projects=tag:runtime:dotnet --withTarget=format-check 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          if [ -n "$PROJECTS" ]; then
            pnpm exec nx run-many --target=format-check --projects="$PROJECTS"
          else
            echo "No affected .NET projects with format-check target"
          fi

      - name: Check .NET formatting (Push - all projects)
        if: github.event_name != 'pull_request'
        run: pnpm run nx:dotnet-format-check

      - name: Lint .NET projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: |
          PROJECTS=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref }} --head=HEAD --projects=tag:runtime:dotnet --withTarget=lint 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          if [ -n "$PROJECTS" ]; then
            pnpm exec nx run-many --target=lint --projects="$PROJECTS"
          else
            echo "No affected .NET projects with lint target"
          fi

      - name: Lint .NET projects (Push - all projects)
        if: github.event_name != 'pull_request'
        run: pnpm run nx:dotnet-lint

      - name: Test .NET projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: |
          PROJECTS=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref }} --head=HEAD --projects=tag:runtime:dotnet --withTarget=test 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          if [ -n "$PROJECTS" ]; then
            pnpm exec nx run-many --target=test --projects="$PROJECTS"
          else
            echo "No affected .NET projects with test target"
          fi

      - name: Test .NET projects (Push - all projects)
        if: github.event_name != 'pull_request'
        run: pnpm run nx:dotnet-test

      - name: Build .NET projects (PR - affected only)
        if: github.event_name == 'pull_request'
        run: |
          PROJECTS=$(pnpm exec nx show projects --affected --base=origin/${{ github.base_ref }} --head=HEAD --projects=tag:runtime:dotnet --withTarget=build 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          if [ -n "$PROJECTS" ]; then
            pnpm exec nx run-many --target=build --projects="$PROJECTS"
          else
            echo "No affected .NET projects with build target"
          fi

      - name: Build .NET projects (Push - all projects)
        if: github.event_name != 'pull_request'
        run: pnpm run nx:dotnet-build

      - name: Upload .NET artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-dotnet
          path: |
            dist/
            coverage/
            test-results/
          retention-days: 7

  # Validate Kustomize manifests for all environments when infra files change.
  # Runs in parallel with language jobs. Blocks detect-infra-changes (and therefore
  # deployment) if any environment fails to build.
  validate-infra:
    needs: setup-base
    runs-on: ubuntu-latest
    outputs:
      infra-changed: ${{ steps.detect.outputs.infra-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect infra file changes
        id: detect
        shell: bash
        run: |
          # First push / workflow_call → always validate
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "infra-changed=true" >> $GITHUB_OUTPUT
            echo "ℹ️  First push or workflow_call — running full infra validation"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if git diff --name-only "$BASE" "${{ github.sha }}" | grep -qE '^infra/k8s/.*\.(yaml|yml)$|^infra/deploy-control\.yaml$|^infra/smart-deployment-config\.yaml$'; then
            echo "infra-changed=true" >> $GITHUB_OUTPUT
            echo "✅ Infrastructure files changed — running Kustomize validation"
          else
            echo "infra-changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No infrastructure files changed — skipping Kustomize validation"
          fi

      - name: Install kustomize
        if: steps.detect.outputs.infra-changed == 'true'
        run: |
          KUSTOMIZE_VERSION="v5.4.3"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/kustomize.tar.gz
          tar xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install -o root -g root -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Validate Hetzner dev
        if: steps.detect.outputs.infra-changed == 'true'
        run: |
          echo "▶ kustomize build infra/k8s/hetzner/dev"
          kustomize build infra/k8s/hetzner/dev --enable-alpha-plugins > /dev/null
          echo "✅ hetzner/dev passed"

      - name: Validate Hetzner test
        if: steps.detect.outputs.infra-changed == 'true'
        run: |
          echo "▶ kustomize build infra/k8s/hetzner/test"
          kustomize build infra/k8s/hetzner/test --enable-alpha-plugins > /dev/null
          echo "✅ hetzner/test passed"

      - name: Validate Hetzner prod
        if: steps.detect.outputs.infra-changed == 'true'
        run: |
          echo "▶ kustomize build infra/k8s/hetzner/prod"
          kustomize build infra/k8s/hetzner/prod --enable-alpha-plugins > /dev/null
          echo "✅ hetzner/prod passed"

      - name: Validate Podman local
        if: steps.detect.outputs.infra-changed == 'true'
        run: |
          echo "▶ kustomize build infra/k8s/podman/local"
          kustomize build infra/k8s/podman/local --enable-alpha-plugins > /dev/null
          echo "✅ podman/local passed"

  # Validate container image builds on PRs (no push) after quality checks pass.
  # Catches broken Dockerfiles before merge without polluting the registry.
  validate-images:
    needs: [node, python, dotnet]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !contains(needs.*.result, 'failure')
    uses: ./.github/workflows/build-push-images.yml
    with:
      environment: ${{ github.base_ref == 'main' && 'prod' || github.base_ref == 'test' && 'test' || 'dev' }}
      projects: affected
      push: false
    secrets: inherit

  # Detect which infrastructure workflows need to be triggered
  detect-infra-changes:
    needs: [node, python, dotnet, validate-infra] # Wait for all quality checks to pass
    if: |
      always() &&
      github.event_name == 'push' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    outputs:
      cluster-changed: ${{ steps.detect.outputs.cluster-changed }}
      deploy-changed: ${{ steps.detect.outputs.deploy-changed }}
      images-changed: ${{ steps.detect.outputs.images-changed }}
      manifest_services: ${{ steps.detect.outputs.manifest_services }}
      branch: ${{ steps.detect.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for accurate multi-commit diff

      - name: Detect infrastructure changes
        id: detect
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          else
            FILES=$(git diff --name-only HEAD^ HEAD)
          fi

          echo "Changed files:"
          echo "$FILES"

          cluster=false
          deploy=false
          images=false
          manifest_services=""

          if echo "$FILES" | grep -E -q '^infra/k8s/hetzner/.*/cluster/|^\.github/workflows/provision-hetzner-k8s-cluster\.yml|^\.github/actions/provision-hetzner-k8s-cluster/'; then
            cluster=true
            echo "✅ Cluster configuration changes detected"
          fi

          if echo "$FILES" | grep -E -q '^infra/k8s/base/|^infra/deploy-control\.yaml|^infra/smart-deployment-config\.yaml|^infra/k8s/hetzner/.*/patches/|^\.github/workflows/deploy-k8s-resources\.yml|^\.github/actions/deploy-k8s-resources/|^\.github/actions/load-deploy-control/|^\.github/workflows/ci\.yml'; then
            deploy=true
            echo "✅ Deploy resource changes detected"
          fi

          DEPLOY_FILES=$(echo "$FILES" | grep -E '^infra/k8s/(base|hetzner/.*/patches)/deployments/.*\.deployment\.yaml$' || true)
          if [ -n "$DEPLOY_FILES" ]; then
            manifest_services=$(echo "$DEPLOY_FILES" | sed 's|.*/||; s|\.deployment\.yaml$||' | sort -u | paste -sd ',' -)
            echo "✅ Deployment manifest services detected: $manifest_services"
          fi

          if echo "$FILES" | grep -E -q '^apps/.*/Dockerfile|^apps/.*\.(cs|ts|tsx|py|js|jsx|css|scss)$|^apps/.*\.csproj$|^apps/.*/package\.json$|^apps/.*/pyproject\.toml$|^apps/.*/requirements\.txt$|^apps/api-gateway/Configuration/.*\.json$|^libs/|^tools/docker/|^\.github/workflows/build-push-images\.yml|^\.github/actions/build-push-image/|^pnpm-lock\.yaml$|^uv\.lock$|^pyproject\.toml$|^Directory\.Build\.(props|targets)$|^Directory\.Packages\.props$|^nuget\.config$|^global\.json$|^infra/k8s/base/deployments/|^infra/k8s/hetzner/.*/patches/deployments/'; then
            images=true
            echo "✅ Container image changes detected"
          fi

          BRANCH="${{ github.ref_name }}"

          echo "cluster-changed=$cluster" >> $GITHUB_OUTPUT
          echo "deploy-changed=$deploy" >> $GITHUB_OUTPUT
          echo "images-changed=$images" >> $GITHUB_OUTPUT
          echo "manifest_services=$manifest_services" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

  # Trigger cluster provisioning workflow if cluster configs changed
  trigger-provision:
    needs: [detect-infra-changes]
    if: |
      always() &&
      needs.detect-infra-changes.result == 'success' &&
      needs.detect-infra-changes.outputs.cluster-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Determine environment from branch
        id: env
        run: |
          BRANCH="${{ needs.detect-infra-changes.outputs.branch }}"
          if [ "$BRANCH" = "main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "test" ]; then
            echo "environment=test" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Trigger cluster provisioning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🚀 Triggering cluster provisioning for ${{ steps.env.outputs.environment }} environment..."
          gh workflow run provision-hetzner-k8s-cluster.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            --field environment=${{ steps.env.outputs.environment }}
          echo "✅ Cluster provisioning workflow triggered"

  # Build container images when source code changed.
  # Uses workflow_call (not workflow_dispatch) so no PAT is needed.
  trigger-image-build:
    needs: [detect-infra-changes]
    if: |
      always() &&
      needs.detect-infra-changes.result == 'success' &&
      needs.detect-infra-changes.outputs.images-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Determine environment from branch
        id: env
        run: |
          BRANCH="${{ needs.detect-infra-changes.outputs.branch }}"
          if [ "$BRANCH" = "main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "test" ]; then
            echo "environment=test" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Trigger image build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🐳 Triggering container image build for ${{ steps.env.outputs.environment }} environment..."

          gh workflow run build-push-images.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            --field environment=${{ steps.env.outputs.environment }} \
            --field projects=affected \
            --field push=true
          echo "✅ Image build workflow triggered"

  # Trigger deploy workflow if ONLY deploy resources changed (not images)
  # If images also changed, build-push-images workflow will trigger deploy after images are ready
  trigger-deploy:
    needs: [detect-infra-changes]
    if: |
      always() &&
      needs.detect-infra-changes.result == 'success' &&
      needs.detect-infra-changes.outputs.deploy-changed == 'true' &&
      needs.detect-infra-changes.outputs.cluster-changed != 'true' &&
      needs.detect-infra-changes.outputs.images-changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Detect changed services
        id: detect-services
        shell: bash
        run: |
          # Get changed files
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            FILES=$(git diff --name-only HEAD^ HEAD)
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi

          echo "Changed files:"
          echo "$FILES"

          # Determine environment from branch
          BRANCH="${{ needs.detect-infra-changes.outputs.branch }}"
          if [ "$BRANCH" = "main" ]; then
            ENV="prod"
          elif [ "$BRANCH" = "test" ]; then
            ENV="test"
          else
            ENV="dev"
          fi

          echo "Target environment: $ENV"

          # Load smart-deployment-config.yaml configuration
          CONFIG_FILE="infra/smart-deployment-config.yaml"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Configuration file not found: $CONFIG_FILE"
            exit 1
          fi

          # Extract global triggers from config
          GLOBAL_TRIGGERS=$(yq -r '.global_triggers.paths[]' "$CONFIG_FILE" | paste -sd '|' -)

          # Extract ignored paths from config
          IGNORED_PATHS=$(yq -r '.ignored_paths.paths[]' "$CONFIG_FILE" | paste -sd '|' -)

          # Check for global triggers (files that affect all services)
          if echo "$FILES" | grep -E -q "$GLOBAL_TRIGGERS"; then
            echo "deploy_strategy=all" >> $GITHUB_OUTPUT
            echo "services=all" >> $GITHUB_OUTPUT
            echo "environment=$ENV" >> $GITHUB_OUTPUT
            echo "🚨 Global trigger detected - deploying ALL services to $ENV"
            exit 0
          fi

          # Check for ignored paths (documentation only)
          if [ -n "$IGNORED_PATHS" ] && echo "$FILES" | grep -E -q "$IGNORED_PATHS"; then
            # Filter out ignored files
            FILES=$(echo "$FILES" | grep -v -E "$IGNORED_PATHS")
            if [ -z "$FILES" ]; then
              echo "deploy_strategy=none" >> $GITHUB_OUTPUT
              echo "services=" >> $GITHUB_OUTPUT
              echo "environment=$ENV" >> $GITHUB_OUTPUT
              echo "ℹ️  Only ignored files changed - skipping deployment"
              exit 0
            fi
          fi

          # Detect affected services by checking each service's resource paths
          affected_services=""

          # Get list of all services from config
          SERVICES=$(yq -r '.services | keys[]' "$CONFIG_FILE")

          for service in $SERVICES; do
            echo "Checking service: $service"
            
            # Get all resource paths for this service and convert wildcards to regex
            RESOURCE_PATHS=$(yq -r ".services.$service.resources[]" "$CONFIG_FILE" | while read -r path; do
              # Replace ** with .* for regex matching
              # Replace * with [^/]* for single-level wildcard
              # Escape dots
              echo "$path" | sed 's|\*\*|.*|g; s|\*|[^/]*|g; s|\.|\\.|g'
            done | paste -sd '|' -)
            
            # Check if any changed files match this service's resource paths
            # Use environment-aware matching (only match files for current env or base/)
            if echo "$FILES" | grep -E -q "^($RESOURCE_PATHS)$"; then
              # Additional environment isolation check
              # If file is in a patch directory, verify it's for the correct environment
              ENV_FILES=$(echo "$FILES" | grep -E "^($RESOURCE_PATHS)$" | grep -E "infra/k8s/(hetzner|podman)/" || true)
              BASE_FILES=$(echo "$FILES" | grep -E "^($RESOURCE_PATHS)$" | grep -v -E "infra/k8s/(hetzner|podman)/" || true)
              
              # If we have env-specific files, check they match our target env
              if [ -n "$ENV_FILES" ]; then
                if echo "$ENV_FILES" | grep -E -q "/$ENV/"; then
                  echo "  ✅ Service affected (environment-specific change for $ENV)"
                  affected_services="$service,$affected_services"
                else
                  echo "  ⏭️  Skipping (change for different environment)"
                fi
              # If only base files changed, they affect this environment
              elif [ -n "$BASE_FILES" ]; then
                echo "  ✅ Service affected (base resource change)"
                affected_services="$service,$affected_services"
              fi
            fi
          done

          # Remove trailing comma
          affected_services=${affected_services%,}

          if [ -z "$affected_services" ]; then
            echo "deploy_strategy=none" >> $GITHUB_OUTPUT
            echo "services=" >> $GITHUB_OUTPUT
            echo "environment=$ENV" >> $GITHUB_OUTPUT
            echo "ℹ️  No K8s services affected in $ENV environment - skipping deployment"
          else
            echo "deploy_strategy=single" >> $GITHUB_OUTPUT
            echo "services=$affected_services" >> $GITHUB_OUTPUT
            echo "environment=$ENV" >> $GITHUB_OUTPUT
            echo "✅ Affected services in $ENV: $affected_services"
          fi

      - name: Trigger resource deployment
        if: steps.detect-services.outputs.deploy_strategy != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STRATEGY="${{ steps.detect-services.outputs.deploy_strategy }}"
          SERVICES="${{ steps.detect-services.outputs.services }}"
          ENV="${{ steps.detect-services.outputs.environment }}"

          if [ "$STRATEGY" = "all" ]; then
            echo "🚀 Triggering FULL deployment (all services) for $ENV environment..."
          else
            echo "🎯 Triggering TARGETED deployment for $ENV environment: $SERVICES"
          fi

          gh workflow run deploy-k8s-resources.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            --field environment="$ENV" \
            --field deploy_strategy="$STRATEGY" \
            --field services="$SERVICES"

          echo "✅ Deployment workflow triggered"
