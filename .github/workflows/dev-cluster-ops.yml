name: Dev Cluster Ops

# #1034: engineers have no dev kubeconfig and no Hetzner console. This workflow shows why a dev
# node failed and brings it back. It uses the `KUBECONFIG` and `HETZNER_TOKEN` secrets of the
# GitHub `dev` environment. Never point it at test or prod.
#
# Read-only actions: `status`, `node-journal`. Write actions: `reset-node`, `poweron-node`,
# `restart-deployment`, `delete-pod`. A write action refuses a target outside the dev cluster.
#
# `workflow_dispatch` runs only from the default branch (dev). The first run needs this file
# merged first.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        default: status
        options:
          - status
          - node-journal
          - reset-node
          - poweron-node
          - restart-deployment
          - delete-pod
      target:
        description: "Node, Deployment or pod name. Not used by status."
        required: false
        type: string
        default: ""
      boot:
        description: "node-journal: boot offset. -1 is the boot before the current one."
        required: false
        type: number
        default: -1

permissions:
  contents: read

concurrency:
  group: dev-cluster-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    env:
      ACTION: ${{ inputs.action }}
      TARGET: ${{ inputs.target }}
      BOOT: ${{ inputs.boot }}
      CLUSTER_PREFIX: hetzner-dev-cluster-
      HCLOUD_TOKEN: ${{ secrets.HETZNER_TOKEN }}
    steps:
      - name: Refuse a ref other than dev, or a target outside the dev cluster
        run: |
          if [ "$GITHUB_REF_NAME" != "dev" ]; then
            echo "::error::Run this workflow from dev only."
            exit 1
          fi
          case "$ACTION" in
            reset-node|poweron-node|node-journal)
              [[ "$TARGET" =~ ^${CLUSTER_PREFIX}[a-z0-9-]+$ ]] || {
                echo "::error::Target must be a node name that starts with ${CLUSTER_PREFIX}."
                exit 1
              } ;;
            restart-deployment|delete-pod)
              [[ "$TARGET" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
                echo "::error::Target must be one Deployment or pod name in namespace default."
                exit 1
              } ;;
          esac

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -Ls https://dl.k8s.io/release/stable.txt || echo "v1.31.0")
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get ns default >/dev/null

      # Same filter as Dev Service Logs. A workflow log is visible to every repository reader.
      - name: Write the redaction filter and the Hetzner helper
        run: |
          cat > /tmp/redact.sed <<'SED_EOF'
          s/([Bb]earer|[Bb]asic)[[:space:]]+[A-Za-z0-9._~+\/=-]+/\1 [REDACTED]/g
          s/([Pp]ass(word|wd)?|[Ss]ecret|[Tt]oken|[Aa]pi[_-]?[Kk]ey)(["']?[[:space:]]*[:=][[:space:]]*["']?)[^"',;[:space:]]+/\1\3[REDACTED]/g
          s/(postgres(ql)?|redis|amqp):\/\/[^[:space:]"']+/\1:\/\/[REDACTED]/g
          s/([0-9]{1,3}\.){3}[0-9]{1,3}/[IP]/g
          s/^(\[IP\]|[0-9a-fA-F:]+) - [^ ]+ \[/\1 - [USER] [/
          SED_EOF
          cat > /tmp/hcloud.sh <<'SH_EOF'
          hcloud() {
            curl -fsS --retry 3 --retry-all-errors --retry-delay 3 \
              -H "Authorization: Bearer $HCLOUD_TOKEN" "$@"
          }
          # Prints the Hetzner server id for a node name, or fails.
          server_id() {
            local id
            id=$(hcloud "https://api.hetzner.cloud/v1/servers?name=$1" | jq -r '.servers[0].id // empty')
            [ -n "$id" ] || { echo "::error::No Hetzner server is named $1."; return 1; }
            echo "$id"
          }
          SH_EOF

      - name: Status
        if: env.ACTION == 'status'
        run: |
          source /tmp/hcloud.sh
          {
            echo "## Dev cluster status"
            echo ""
            echo "### Node conditions"
            echo '```'
            kubectl get nodes -o json | jq -r '.items[] | .metadata.name as $n
              | .status.conditions[] | [$n, .type, .status, .reason, .lastHeartbeatTime, .lastTransitionTime] | @tsv' \
              | column -t
            echo '```'
            echo ""
            echo "### Node requests and limits"
            echo '```'
            for node in $(kubectl get nodes -o name); do
              echo "${node#node/}"
              kubectl describe "$node" | sed -n '/Allocated resources/,/Events/p' | sed '$d'
            done
            kubectl top nodes 2>&1 || true
            echo '```'
            echo ""
            echo "### Node events"
            echo '```'
            kubectl get events -A --field-selector involvedObject.kind=Node --sort-by=.lastTimestamp 2>&1 | tail -n 40
            echo '```'
            echo ""
            echo "### Hetzner servers"
            echo '```'
            hcloud "https://api.hetzner.cloud/v1/servers?per_page=50" | jq -r --arg p "$CLUSTER_PREFIX" \
              '.servers[] | select(.name | startswith($p)) | [.name, .status, .server_type.name, .created] | @tsv' \
              | column -t
            echo '```'
            START=$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            for row in $(hcloud "https://api.hetzner.cloud/v1/servers?per_page=50" | jq -r --arg p "$CLUSTER_PREFIX" \
              '.servers[] | select(.name | startswith($p)) | "\(.id):\(.name)"'); do
              id=${row%%:*}; name=${row#*:}
              echo ""
              echo "### $name: last Hetzner actions"
              echo '```'
              hcloud "https://api.hetzner.cloud/v1/servers/$id/actions?sort=started:desc&per_page=15" \
                | jq -r '.actions[] | [.started, .finished, .command, .status, (.error.message // "")] | @tsv' | column -t -s $'\t'
              echo '```'
              echo ""
              echo "### $name: CPU percent per hour, last 48 h (empty values mean no data, so the server was down)"
              echo '```'
              hcloud "https://api.hetzner.cloud/v1/servers/$id/metrics?type=cpu&start=$START&end=$END&step=3600" \
                | jq -r '.metrics.time_series.cpu.values[] | "\(.[0] | floor | todate)  \(.[1])"' 2>&1 || echo "(no metrics)"
              echo '```'
            done
          } | sed -E -f /tmp/redact.sed | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Node journal
        if: env.ACTION == 'node-journal'
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          source /tmp/hcloud.sh
          id=$(server_id "$TARGET")
          IP=$(hcloud "https://api.hetzner.cloud/v1/servers/$id" | jq -r '.server.public_net.ipv4.ip')
          install -m 600 /dev/null ~/.ssh_key
          printf '%s\n' "$SSH_KEY" > ~/.ssh_key
          {
            echo "## $TARGET: journal of boot $BOOT"
            echo '```'
            ssh -i ~/.ssh_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=20 -o BatchMode=yes "root@$IP" BOOT="$BOOT" bash -s <<'REMOTE_EOF' 2>&1
          echo "--- uptime, memory, disk"
          uptime; free -m; df -h / /var/lib/rancher 2>/dev/null
          echo "--- boots"
          journalctl --list-boots --no-pager | tail -n 5
          echo "--- shutdowns and reboots"
          last -x -F | head -n 15
          echo "--- kernel: OOM, panic, hung task, I/O errors (boot $BOOT)"
          journalctl -k -b "$BOOT" --no-pager \
            | grep -iE 'out of memory|oom|killed process|panic|hung task|blocked for more|i/o error|soft lockup' \
            | tail -n 60
          echo "--- last 60 lines of boot $BOOT (how it ended)"
          journalctl -b "$BOOT" --no-pager | tail -n 60
          echo "--- k3s agent warnings (boot $BOOT)"
          journalctl -b "$BOOT" -u k3s-agent -u k3s -p warning --no-pager | tail -n 60
          REMOTE_EOF
            echo '```'
          } | sed -E -f /tmp/redact.sed | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f ~/.ssh_key

      - name: Reset or power on a node
        if: env.ACTION == 'reset-node' || env.ACTION == 'poweron-node'
        run: |
          source /tmp/hcloud.sh
          id=$(server_id "$TARGET")
          VERB=${ACTION%-node}
          echo "Hetzner $VERB: $TARGET"
          hcloud -X POST "https://api.hetzner.cloud/v1/servers/$id/actions/$VERB" | jq -r '.action | "\(.command) \(.status)"'
          echo "Waiting up to 10 minutes for node $TARGET to report Ready..."
          kubectl wait --for=condition=Ready "node/$TARGET" --timeout=10m
          kubectl get nodes

      - name: Restart a Deployment
        if: env.ACTION == 'restart-deployment'
        run: |
          kubectl rollout restart "deployment/$TARGET" -n default
          kubectl rollout status "deployment/$TARGET" -n default --timeout=5m

      # A force delete of a StatefulSet pod on an unreachable node can start a second copy on the
      # same volume, so this action never forces one.
      - name: Delete a pod
        if: env.ACTION == 'delete-pod'
        run: |
          OWNER=$(kubectl get pod "$TARGET" -n default -o jsonpath='{.metadata.ownerReferences[0].kind}')
          NODE=$(kubectl get pod "$TARGET" -n default -o jsonpath='{.spec.nodeName}')
          READY=$(kubectl get node "$NODE" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
          if [ "$OWNER" = "StatefulSet" ] && [ "$READY" != "True" ]; then
            echo "::error::$TARGET belongs to a StatefulSet on node $NODE, which is not Ready. Bring the node back with reset-node instead."
            exit 1
          fi
          if [ "$READY" = "True" ]; then
            kubectl delete pod "$TARGET" -n default --wait=true --timeout=2m
          else
            kubectl delete pod "$TARGET" -n default --grace-period=0 --force
          fi
          kubectl get pods -n default -o wide | sed -E -f /tmp/redact.sed
