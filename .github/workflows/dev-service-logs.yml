name: Dev Service Logs

# #957: engineers have no dev kubeconfig. This workflow prints recent errors from the dev
# services, read-only, with the `KUBECONFIG` secret of the GitHub `dev` environment.
# It runs only `kubectl get` and `kubectl logs`. Never point it at test or prod.
#
# `workflow_dispatch` runs only from the default branch (dev). The first run needs this file
# merged first.

on:
  workflow_dispatch:
    inputs:
      since_minutes:
        description: "Read logs from the last N minutes"
        required: true
        type: number
        default: 60
      max_lines:
        description: "Most matching lines printed per pod"
        required: true
        type: number
        default: 200

permissions:
  contents: read

concurrency:
  group: dev-service-logs
  cancel-in-progress: false

jobs:
  logs:
    runs-on: ubuntu-latest
    environment: dev
    env:
      APPS: api-gateway property-service bright-sync-worker cribstop-web account-service
      SINCE: ${{ inputs.since_minutes }}m
      MAX_LINES: ${{ inputs.max_lines }}
    steps:
      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -Ls https://dl.k8s.io/release/stable.txt || echo "v1.31.0")
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get ns default >/dev/null

      # Every printed line passes through this filter. Logs can hold tokens, connection strings
      # and visitor IPs, and a workflow log is visible to every repository reader.
      - name: Write the redaction filter
        run: |
          cat > /tmp/redact.sed <<'SED_EOF'
          s/([Bb]earer|[Bb]asic)[[:space:]]+[A-Za-z0-9._~+\/=-]+/\1 [REDACTED]/g
          s/([Pp]ass(word|wd)?|[Ss]ecret|[Tt]oken|[Aa]pi[_-]?[Kk]ey)(["']?[[:space:]]*[:=][[:space:]]*["']?)[^"',;[:space:]]+/\1\3[REDACTED]/g
          s/(postgres(ql)?|redis|amqp):\/\/[^[:space:]"']+/\1:\/\/[REDACTED]/g
          s/([0-9]{1,3}\.){3}[0-9]{1,3}/[IP]/g
          SED_EOF

      - name: Pods, restarts and last termination
        run: |
          {
            echo "## Dev service logs (last ${SINCE})"
            echo ""
            echo "### Pods"
            echo '```'
            for app in $APPS; do
              kubectl get pods -n default -l "app=$app" -o custom-columns='POD:.metadata.name,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount,LAST_EXIT:.status.containerStatuses[0].lastState.terminated.reason,LAST_EXIT_AT:.status.containerStatuses[0].lastState.terminated.finishedAt,STARTED:.status.startTime' --no-headers 2>&1
            done
            echo '```'
            echo ""
            echo "### Warning events"
            echo '```'
            kubectl get events -n default --field-selector type=Warning --sort-by=.lastTimestamp 2>&1 | tail -n 50
            echo '```'
          } | sed -E -f /tmp/redact.sed | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Service errors
        run: |
          PATTERN='error|exception|fail|timeout|timed out|refused|unavailable|circuit|broken|429|rate.?limit|status(code)?[":= ]+5[0-9][0-9]|" 5[0-9][0-9] |ECONN|EAI_AGAIN|OOMKilled|SIGTERM'
          for app in $APPS; do
            for pod in $(kubectl get pods -n default -l "app=$app" -o name); do
              {
                echo ""
                echo "### ${pod#pod/}"
                echo '```'
                for flag in "" "--previous"; do
                  out=$(kubectl logs "$pod" -n default --all-containers --since="$SINCE" --timestamps $flag 2>/dev/null || true)
                  [ -z "$out" ] && continue
                  [ -n "$flag" ] && echo "--- previous container ---"
                  echo "$out" | grep -Ei "$PATTERN" | tail -n "$MAX_LINES"
                  echo "($(echo "$out" | wc -l) lines read, $(echo "$out" | grep -Eic "$PATTERN") matched)"
                done
                echo '```'
              } | sed -E -f /tmp/redact.sed | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done

      - name: Ingress 429 and 5xx
        run: |
          {
            echo ""
            echo "### ingress-nginx: 429 and 5xx access lines"
            echo '```'
            for pod in $(kubectl get pods -n ingress-nginx -l app.kubernetes.io/component=controller -o name); do
              out=$(kubectl logs "$pod" -n ingress-nginx --since="$SINCE" 2>/dev/null || true)
              echo "$out" | grep -E '" (429|5[0-9][0-9]) ' | tail -n "$MAX_LINES"
              echo "(${pod#pod/}: $(echo "$out" | grep -Ec '" 429 ') x 429, $(echo "$out" | grep -Ec '" 5[0-9][0-9] ') x 5xx)"
            done
            echo '```'
          } | sed -E -f /tmp/redact.sed | tee -a "$GITHUB_STEP_SUMMARY"
