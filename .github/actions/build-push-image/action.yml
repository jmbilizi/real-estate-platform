name: "Build and Push Docker Image"
description: "Build Docker image with BuildKit caching and push to GitHub Container Registry"
author: "Real Estate Platform Team"

inputs:
  project:
    description: "Project name to build (e.g., api-gateway)"
    required: true
  tag:
    description: "Image tag to apply"
    required: true
  registry:
    description: "Container registry URL"
    required: false
    default: "ghcr.io"
  owner:
    description: "Registry owner/organization (defaults to repository owner)"
    required: false
    default: ${{ github.repository_owner }}
  repo:
    description: "Repository name (defaults to repository name)"
    required: false
    default: ${{ github.event.repository.name }}
  push:
    description: "Push image after build"
    required: false
    default: "true"
  platform:
    description: "Target platform (e.g., linux/amd64, linux/arm64)"
    required: false
    default: "linux/amd64"
  github-token:
    description: "GitHub token for GHCR authentication"
    required: true
  scan-image:
    description: "Scan image for vulnerabilities with Trivy"
    required: false
    default: "true"
  cache-from:
    description: "External cache sources (comma-separated)"
    required: false
    default: ""
  maxmind-license-key:
    description: "MaxMind license key for GeoIP2 database download"
    required: false
    default: ""

outputs:
  image:
    description: "Full image name with tag"
    value: ${{ steps.build.outputs.image }}
  image-name:
    description: "Resolved image name (may differ from project name)"
    value: ${{ steps.resolve-name.outputs.image-name }}
  digest:
    description: "Image digest (sha256)"
    value: ${{ steps.build.outputs.digest }}
  size:
    description: "Image size in MB"
    value: ${{ steps.build.outputs.size }}
  scan-results:
    description: "Vulnerability scan results (if enabled)"
    value: ${{ steps.scan.outputs.results }}

runs:
  using: "composite"
  steps:
    - name: Resolve image name
      id: resolve-name
      shell: bash
      run: |
        # Check image-name-map.json for overrides (e.g., multi-model-inference → inference)
        MAP_FILE="tools/docker/image-name-map.json"
        PROJECT="${{ inputs.project }}"
        IMAGE_NAME="$PROJECT"  # default: use project name as-is

        if [ -f "$MAP_FILE" ]; then
          MAPPED=$(jq -r --arg p "$PROJECT" '.[$p].imageName // empty' "$MAP_FILE")
          if [ -n "$MAPPED" ]; then
            IMAGE_NAME="$MAPPED"
            echo "ℹ️  Image name override: $PROJECT → $IMAGE_NAME (from image-name-map.json)"
          fi
        fi

        echo "image-name=$IMAGE_NAME" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          image=moby/buildkit:latest

    - name: Log in to GitHub Container Registry
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.owner }}/${{ inputs.repo }}/${{ steps.resolve-name.outputs.image-name }}
        tags: |
          type=raw,value=${{ inputs.tag }}
        labels: |
          org.opencontainers.image.title=${{ steps.resolve-name.outputs.image-name }}
          org.opencontainers.image.description=${{ steps.resolve-name.outputs.image-name }} service
          org.opencontainers.image.vendor=Real Estate Platform
          org.opencontainers.image.source=https://github.com/${{ inputs.owner }}/${{ inputs.repo }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

    - name: Determine Dockerfile path
      id: dockerfile
      shell: bash
      run: |
        PROJECT="${{ inputs.project }}"
        MAP_FILE="tools/docker/image-name-map.json"

        # Check image-name-map.json for explicit Dockerfile path override
        if [ -f "$MAP_FILE" ]; then
          OVERRIDE_PATH=$(jq -r --arg p "$PROJECT" '.[$p].dockerfilePath // empty' "$MAP_FILE")
          if [ -n "$OVERRIDE_PATH" ] && [ -f "${OVERRIDE_PATH}/Dockerfile" ]; then
            echo "path=${OVERRIDE_PATH}/Dockerfile" >> $GITHUB_OUTPUT
            echo "context=." >> $GITHUB_OUTPUT
            echo "✅ Found Dockerfile at ${OVERRIDE_PATH}/Dockerfile (from image-name-map.json)"
            exit 0
          fi
        fi

        # Fallback: search common locations
        if [ -f "apps/${PROJECT}/Dockerfile" ]; then
          echo "path=apps/${PROJECT}/Dockerfile" >> $GITHUB_OUTPUT
          echo "context=." >> $GITHUB_OUTPUT
          echo "✅ Found Dockerfile at apps/${PROJECT}/Dockerfile"
        elif [ -f "apps/services/${PROJECT}/Dockerfile" ]; then
          echo "path=apps/services/${PROJECT}/Dockerfile" >> $GITHUB_OUTPUT
          echo "context=." >> $GITHUB_OUTPUT
          echo "✅ Found Dockerfile at apps/services/${PROJECT}/Dockerfile"
        elif [ -f "libs/${PROJECT}/Dockerfile" ]; then
          echo "path=libs/${PROJECT}/Dockerfile" >> $GITHUB_OUTPUT
          echo "context=." >> $GITHUB_OUTPUT
          echo "✅ Found Dockerfile at libs/${PROJECT}/Dockerfile"
        else
          echo "❌ Dockerfile not found for project: ${PROJECT}"
          exit 1
        fi

    - name: Create workspace certs directory for BuildKit
      shell: bash
      run: |
        # Docker BuildKit requires bind mount sources to exist even when not used
        # Create empty directory to satisfy BuildKit cache key calculation
        mkdir -p .workspace-certs
        echo "✅ Created .workspace-certs directory (required for BuildKit, unused in CI/CD)"

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ${{ steps.dockerfile.outputs.context }}
        file: ${{ steps.dockerfile.outputs.path }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: ${{ inputs.platform }}
        build-args: |
          BUILD_CONFIGURATION=Release
          COPY_CERTS=false
          MAXMIND_LICENSE_KEY=${{ inputs.maxmind-license-key }}
        cache-from: |
          type=registry,ref=${{ inputs.registry }}/${{ inputs.owner }}/${{ inputs.repo }}/${{ steps.resolve-name.outputs.image-name }}:buildcache
          ${{ inputs.cache-from }}
        cache-to: type=registry,ref=${{ inputs.registry }}/${{ inputs.owner }}/${{ inputs.repo }}/${{ steps.resolve-name.outputs.image-name }}:buildcache,mode=max
        provenance: true
        sbom: true

    - name: Extract image info
      id: info
      shell: bash
      run: |
        IMAGE="${{ inputs.registry }}/${{ inputs.owner }}/${{ inputs.repo }}/${{ steps.resolve-name.outputs.image-name }}:${{ inputs.tag }}"
        echo "image=$IMAGE" >> $GITHUB_OUTPUT

        # Get image size if pushed
        if [ "${{ inputs.push }}" = "true" ]; then
          # Pull image metadata
          docker buildx imagetools inspect "$IMAGE" --format '{{json .}}' > /tmp/image-info.json
          
          # Extract size (approximate from layer sizes)
          SIZE=$(jq -r '.manifest.layers | map(.size) | add' /tmp/image-info.json 2>/dev/null || echo "0")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "size=${SIZE_MB}MB" >> $GITHUB_OUTPUT
          echo "📦 Image size: ${SIZE_MB}MB"
        else
          echo "size=N/A (not pushed)" >> $GITHUB_OUTPUT
        fi

        echo "digest=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

        echo "✅ Built image: $IMAGE"
        echo "📌 Digest: ${{ steps.build.outputs.digest }}"

    - name: Scan image for vulnerabilities
      id: scan
      if: inputs.scan-image == 'true' && inputs.push == 'true'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.info.outputs.image }}
        format: "sarif"
        output: "trivy-results.sarif"
        severity: "CRITICAL,HIGH"
        exit-code: "0" # Don't fail build on vulnerabilities, just report

    - name: Upload Trivy results to GitHub Security
      if: inputs.scan-image == 'true' && inputs.push == 'true' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: "trivy-results.sarif"
        category: "container-${{ inputs.project }}"

    - name: Generate vulnerability summary
      id: vuln-summary
      if: inputs.scan-image == 'true' && inputs.push == 'true'
      shell: bash
      run: |
        if [ -f "trivy-results.sarif" ]; then
          CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' trivy-results.sarif)
          HIGH=$(jq '[.runs[].results[] | select(.level == "warning")] | length' trivy-results.sarif)
          
          echo "results=CRITICAL: $CRITICAL, HIGH: $HIGH" >> $GITHUB_OUTPUT
          
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "⚠️  Vulnerabilities found: CRITICAL: $CRITICAL, HIGH: $HIGH"
            echo "📊 View details in Security > Code scanning alerts"
          else
            echo "✅ No critical or high vulnerabilities found"
          fi
        else
          echo "results=Scan not completed" >> $GITHUB_OUTPUT
        fi

    - name: Build summary
      if: always()
      shell: bash
      run: |
        echo "## 🐳 Docker Build Summary: ${{ steps.resolve-name.outputs.image-name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| **Image** | \`${{ steps.info.outputs.image }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Digest** | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Size** | ${{ steps.info.outputs.size }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Platform** | ${{ inputs.platform }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Pushed** | ${{ inputs.push }} |" >> $GITHUB_STEP_SUMMARY

        if [ "${{ inputs.scan-image }}" = "true" ] && [ "${{ inputs.push }}" = "true" ]; then
          echo "| **Security Scan** | ${{ steps.vuln-summary.outputs.results }} |" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Build Args" >> $GITHUB_STEP_SUMMARY
        echo "- BUILD_CONFIGURATION=Release" >> $GITHUB_STEP_SUMMARY
        echo "- COPY_CERTS=false (CI/CD mode)" >> $GITHUB_STEP_SUMMARY
        if [ -n "${{ inputs.maxmind-license-key }}" ]; then
          echo "- MAXMIND_LICENSE_KEY=*** (GeoIP database download enabled)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- MAXMIND_LICENSE_KEY=<not set> (GeoIP features disabled)" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 BuildKit Features" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Layer caching enabled (registry-backed)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ SBOM generation enabled" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Provenance attestation enabled" >> $GITHUB_STEP_SUMMARY
