name: "Deploy K8s Resources"
description: "Build, apply, validate, and optionally rollback workloads for a Kustomize env"
inputs:
  kustomizePath:
    description: "Path to kustomize overlay (e.g., infra/k8s/hetzner/dev)"
    required: true
  kubeconfig:
    description: "Kubeconfig content to write to ~/.kube/config"
    required: true
  statefulset_timeout:
    description: "Timeout for rollout of StatefulSets"
    required: true
  deployment_timeout:
    description: "Timeout for rollout of Deployments"
    required: true
  daemonset_timeout:
    description: "Timeout for rollout of DaemonSets"
    required: true
  rollback_on_failure:
    description: "Service-level rollback enabled"
    required: true
  statefulset_rollback:
    description: "Strategy-level rollback enabled"
    required: true
runs:
  using: "composite"
  steps:
    - name: Install tools (kubectl, yq, jq, kustomize)
      shell: bash
      run: |
        echo "Installing yq and jq"
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq
        sudo apt-get update && sudo apt-get install -y jq
        echo "Installing kubectl"
        curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
        echo "Installing kustomize"
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/

    - name: Configure kubectl
      shell: bash
      run: |
        mkdir -p ~/.kube
        echo "${{ inputs.kubeconfig }}" > ~/.kube/config
        chmod 600 ~/.kube/config
        kubectl version --client
        kubectl cluster-info

    - name: Substitute secrets (Postgres, Redis, Jaeger)
      shell: bash
      run: |
        # In-memory substitution pattern; overwrite templates in workspace
        yq eval '.stringData.POSTGRES_SA_PASSWORD = env(POSTGRES_SA_PASSWORD)' infra/k8s/base/secrets/postgres.secret.yaml | \
        yq eval '.stringData.ACCOUNT_SERVICE_DB_USER_PASSWORD = env(ACCOUNT_SERVICE_DB_USER_PASSWORD)' - | \
        yq eval '.stringData.MESSAGING_SERVICE_DB_USER_PASSWORD = env(MESSAGING_SERVICE_DB_USER_PASSWORD)' - | \
        yq eval '.stringData.PROPERTY_SERVICE_DB_USER_PASSWORD = env(PROPERTY_SERVICE_DB_USER_PASSWORD)' - \
        > /tmp/postgres.secret.processed.yaml
        mv /tmp/postgres.secret.processed.yaml infra/k8s/base/secrets/postgres.secret.yaml

        yq eval '.stringData.REDIS_ADMIN_PASSWORD = env(REDIS_ADMIN_PASSWORD)' infra/k8s/base/secrets/redis.secret.yaml | \
        yq eval '.stringData.REDIS_PUBSUB_PASSWORD = env(REDIS_PUBSUB_PASSWORD)' - | \
        yq eval '.stringData.REDIS_CACHE_PASSWORD = env(REDIS_CACHE_PASSWORD)' - | \
        yq eval '.stringData.REDIS_RATELIMIT_PASSWORD = env(REDIS_RATELIMIT_PASSWORD)' - | \
        yq eval '.stringData.REDIS_MONITOR_PASSWORD = env(REDIS_MONITOR_PASSWORD)' - \
        > /tmp/redis.secret.processed.yaml
        mv /tmp/redis.secret.processed.yaml infra/k8s/base/secrets/redis.secret.yaml

        yq eval '.stringData.auth = env(JAEGER_BASIC_AUTH)' infra/k8s/base/secrets/jaeger.secret.yaml \
        > /tmp/jaeger.secret.processed.yaml
        mv /tmp/jaeger.secret.processed.yaml infra/k8s/base/secrets/jaeger.secret.yaml

    - name: Substitute domain placeholders in ingress manifests
      shell: bash
      run: |
        # Substitute domain placeholders in Hetzner environment ingress patches
        # Pattern matches hetzner-k8s cluster provisioning (in-memory substitution)
        ENV_NAME=$(basename "${{ inputs.kustomizePath }}")

        echo "🔍 Domain substitution status:"
        echo "   Environment: $ENV_NAME"
        if [ -z "$JAEGER_DOMAIN" ]; then
          echo "   ❌ JAEGER_DOMAIN is not set"
        else
          echo "   ✅ JAEGER_DOMAIN is set (value redacted for security)"
          echo "   📝 Domain length: ${#JAEGER_DOMAIN} characters"
        fi

        # Jaeger ingress
        if [ -f "${{ inputs.kustomizePath }}/patches/ingresses/jaeger.ingress.yaml" ]; then
          echo "   📄 Before substitution:"
          grep -E "host:|JAEGER_DOMAIN" "${{ inputs.kustomizePath }}/patches/ingresses/jaeger.ingress.yaml" || true
          
          sed -i "s/JAEGER_DOMAIN_PLACEHOLDER/${JAEGER_DOMAIN}/g" \
            "${{ inputs.kustomizePath }}/patches/ingresses/jaeger.ingress.yaml"
          
          echo "   📄 After substitution:"
          grep -E "host:" "${{ inputs.kustomizePath }}/patches/ingresses/jaeger.ingress.yaml" || true
          
          # Check if placeholder still exists (substitution failed)
          if grep -q "JAEGER_DOMAIN_PLACEHOLDER" "${{ inputs.kustomizePath }}/patches/ingresses/jaeger.ingress.yaml"; then
            echo "   ❌ WARNING: JAEGER_DOMAIN_PLACEHOLDER still present after substitution!"
          else
            echo "   ✅ Substitution completed"
          fi
        else
          echo "   ⚠️  Jaeger ingress file not found at: ${{ inputs.kustomizePath }}/patches/ingresses/jaeger.ingress.yaml"
        fi

    - name: Build manifests
      shell: bash
      run: |
        echo "Building manifests for ${{ inputs.kustomizePath }}"
        kustomize build "${{ inputs.kustomizePath }}" --enable-alpha-plugins > manifests.yaml

    - name: PVC cleanup (BadgerDB corruption handling)
      id: pvc_cleanup
      shell: bash
      run: |
        echo "🧹 Checking pods for persistent failures (CrashLoopBackOff/Init:Error)..."
        # Safely inspect containerStatuses; guard against missing keys/arrays
        FAILED_PODS=$(kubectl get pods -o json | jq -r '
          .items[]
          | select(
              ( [ .status.containerStatuses[]? | .state.waiting?.reason ]
                | any(. == "CrashLoopBackOff" or . == "CreateContainerConfigError" or . == "ErrImagePull") )
            )
          | .metadata.name
        ' 2>/dev/null || echo "")
        if [ -n "$FAILED_PODS" ]; then
          echo "❌ Found pods with persistent failures:"
          echo "$FAILED_PODS" | tr ' ' '\n'
          PVC_DELETED=false
          for pod in $FAILED_PODS; do
            echo "\n🔎 Inspecting logs for $pod..."
            LOGS=$(kubectl logs $pod --all-containers --tail=200 2>/dev/null || echo "")
            if echo "$LOGS" | grep -qi "manifest has unsupported version\|corruption\|badger"; then
              echo "❌ Detected BadgerDB corruption in $pod - likely incompatible with new version"
              STS_NAME=$(echo $pod | sed 's/-[0-9]*$//')
              PVC=$(kubectl get pvc -o json | jq -r ".items[] | select(.metadata.name | contains(\"$STS_NAME\")) | .metadata.name" | head -1)
              if [ -n "$PVC" ]; then
                echo "🗑️  Deleting corrupted PVC: $PVC"
                kubectl delete pod $pod --force --grace-period=0 || true
                kubectl delete pvc $PVC || true
                echo "✅ Cleaned up $pod and $PVC - will recreate with fresh data"
                PVC_DELETED=true
              else
                echo "ℹ️  No PVC found for $pod"
              fi
            else
              echo "ℹ️  No BadgerDB corruption detected in logs - pod may recover naturally"
            fi
          done
          if [ "$PVC_DELETED" = "true" ]; then
            echo "pvc_cleanup_ran=true" >> $GITHUB_OUTPUT
            echo "rollout_success=true" >> $GITHUB_OUTPUT
            echo "⏭️  PVC deleted - pods will recreate in background (skip rollout wait)"
          fi
        else
          echo "✅ No pods with persistent failures - new config working!"
        fi

    - name: Apply manifests with prune + immutable handling
      shell: bash
      run: |
        set -e
        echo "Applying manifests (with prune)"
        if ! kubectl apply -f manifests.yaml --prune -l app.kubernetes.io/managed-by=kustomize 2>&1 | tee apply.log; then
          echo "❌ Apply failed - checking for immutable field conflicts"
          RESOURCE_TYPE=""
          DISPLAY_NAME=""
          DELETE_ARGS=""
          NAME_PATTERN=""

          if grep -q "Forbidden.*updates to statefulset spec.*are forbidden" apply.log; then
            RESOURCE_TYPE="statefulset"
            DISPLAY_NAME="StatefulSet"
            DELETE_ARGS="--cascade=orphan"
            # Support multiple kubectl error formats; prefer explicit resource name line
            NAME_PATTERN='The StatefulSet "\K[^\"]+'
          elif grep -q "Forbidden.*updates to deployment spec.*are forbidden" apply.log; then
            RESOURCE_TYPE="deployment"
            DISPLAY_NAME="Deployment"
            DELETE_ARGS="--cascade=orphan"
            NAME_PATTERN='Resource=deployments.*?Name: "\K[^\"]+'
          elif grep -qE "spec\\.clusterIP.*immutable|spec\\.type.*immutable" apply.log; then
            RESOURCE_TYPE="service"
            DISPLAY_NAME="Service"
            DELETE_ARGS=""
            NAME_PATTERN='Resource=services.*?Name: "\K[^\"]+'
          elif grep -q "Forbidden.*updates to daemonset spec.*are forbidden" apply.log; then
            RESOURCE_TYPE="daemonset"
            DISPLAY_NAME="DaemonSet"
            DELETE_ARGS="--cascade=orphan"
            NAME_PATTERN='Resource=daemonsets.*?Name: "\K[^\"]+'
          elif grep -qE "spec\\.selector.*immutable|spec\\.completions.*cannot be decreased" apply.log; then
            RESOURCE_TYPE="job"
            DISPLAY_NAME="Job"
            DELETE_ARGS=""
            NAME_PATTERN='Resource=jobs.*?Name: "\K[^\"]+'
          fi

          if [ -n "$RESOURCE_TYPE" ]; then
            echo "\n⚠️  Detected immutable $DISPLAY_NAME field changes"
            echo "🔍 Identifying affected ${DISPLAY_NAME}s..."
            # Try to extract resource names from apply log; fallback to manifests list
            FAILED_RESOURCES=$(grep -oP "$NAME_PATTERN" apply.log || echo "")
            if [ -z "$FAILED_RESOURCES" ]; then
              if [ "$RESOURCE_TYPE" = "statefulset" ]; then
                FAILED_RESOURCES=$(yq -N e 'select(.kind == "StatefulSet") | .metadata.name' manifests.yaml 2>/dev/null | grep -v '^---$' | tr '\n' ' ' || echo "")
              elif [ "$RESOURCE_TYPE" = "deployment" ]; then
                FAILED_RESOURCES=$(yq -N e 'select(.kind == "Deployment") | .metadata.name' manifests.yaml 2>/dev/null | grep -v '^---$' | tr '\n' ' ' || echo "")
              elif [ "$RESOURCE_TYPE" = "daemonset" ]; then
                FAILED_RESOURCES=$(yq -N e 'select(.kind == "DaemonSet") | .metadata.name' manifests.yaml 2>/dev/null | grep -v '^---$' | tr '\n' ' ' || echo "")
              elif [ "$RESOURCE_TYPE" = "service" ]; then
                FAILED_RESOURCES=$(yq -N e 'select(.kind == "Service") | .metadata.name' manifests.yaml 2>/dev/null | grep -v '^---$' | tr '\n' ' ' || echo "")
              elif [ "$RESOURCE_TYPE" = "job" ]; then
                FAILED_RESOURCES=$(yq -N e 'select(.kind == "Job") | .metadata.name' manifests.yaml 2>/dev/null | grep -v '^---$' | tr '\n' ' ' || echo "")
              fi
            fi
            if [ -z "$FAILED_RESOURCES" ]; then
              echo "❌ Could not identify failed ${DISPLAY_NAME}s from error message or manifests"
              echo "Error log:"
              cat apply.log
              exit 1
            fi
            echo "📋 ${DISPLAY_NAME}s requiring recreation:"
            for res in $FAILED_RESOURCES; do echo "  - $res"; done
            CASCADE_INFO=""
            [ "$DELETE_ARGS" = "--cascade=orphan" ] && CASCADE_INFO=" (preserving dependent resources)"
            echo "\n🗑️  Deleting ${DISPLAY_NAME}s with immutable field conflicts${CASCADE_INFO}..."
            for res in $FAILED_RESOURCES; do
              if [ -n "$res" ]; then
                echo "  Deleting $DISPLAY_NAME: $res"
                kubectl delete "$RESOURCE_TYPE" "$res" $DELETE_ARGS || true
              fi
            done
            echo "\n🔄 Retrying deployment with recreated ${DISPLAY_NAME}s..."
            kubectl apply -f manifests.yaml --prune -l app.kubernetes.io/managed-by=kustomize
          else
            echo "❌ Deployment failed with non-immutable-field error:"
            cat apply.log
            exit 1
          fi
        else
          echo "✅ Deployment successful (no immutable field conflicts)"
        fi

    - name: Restart only on template change (StatefulSets)
      shell: bash
      run: |
        echo "🔄 Checking if StatefulSet pod templates changed before restarting..."
        NEED_RESTART_STS=""
        EXPECTED_STS=$(yq -N e 'select(.kind=="StatefulSet") | .metadata.name' manifests.yaml 2>/dev/null | grep -v '^---$' || echo "")
        for name in $EXPECTED_STS; do
          DESIRED_RAW=$(yq -N e "select(.kind==\"StatefulSet\" and .metadata.name==\"$name\") | .spec.template" manifests.yaml 2>/dev/null || echo "")
          LIVE_RAW=$(kubectl get statefulset "$name" -o json 2>/dev/null | jq -c '.spec.template' 2>/dev/null || echo "")
          DESIRED_TEMPLATE=$(printf "%s" "$DESIRED_RAW" | jq -c '.' 2>/dev/null || echo "")
          LIVE_TEMPLATE=$(printf "%s" "$LIVE_RAW" | jq -c '.' 2>/dev/null || echo "")
          if [ -z "$DESIRED_TEMPLATE" ] || [ -z "$LIVE_TEMPLATE" ]; then
            echo "ℹ️  Skipping $name: unable to parse desired/live pod template"
            continue
          fi
          LIVE_HASH=$(printf "%s" "$LIVE_TEMPLATE" | sha1sum | awk '{print $1}')
          DESIRED_HASH=$(printf "%s" "$DESIRED_TEMPLATE" | sha1sum | awk '{print $1}')
          if [ "$LIVE_HASH" != "$DESIRED_HASH" ]; then
            NEED_RESTART_STS="$NEED_RESTART_STS $name"
          fi
        done
        if [ -n "$NEED_RESTART_STS" ]; then
          echo "🔄 Forcing rollout restart for changed StatefulSets: $NEED_RESTART_STS"
          for sts in $NEED_RESTART_STS; do
            kubectl rollout restart statefulset/$sts || true
          done
          echo "⏳ Waiting 60 seconds for pods to terminate and restart..."
          sleep 60
        else
          echo "✅ No StatefulSet pod template changes detected - skipping restart"
        fi

    - name: Wait for workload rollout
      id: rollout
      if: ${{ steps.pvc_cleanup.outputs.pvc_cleanup_ran != 'true' && steps.pvc_cleanup.outputs.rollout_success != 'true' }}
      shell: bash
      run: |
        echo "⏳ Waiting for workloads to be ready..."
        ROLLOUT_FAILED=false

        # StatefulSets
        STATEFULSETS=$(yq -N e 'select(.kind == "StatefulSet") | .metadata.name' manifests.yaml 2>/dev/null | grep -v '^---$' | tr '\n' ' ' || echo "")
        if [ -n "$STATEFULSETS" ]; then
          echo "📋 Found StatefulSets: $STATEFULSETS"
          for sts in $STATEFULSETS; do
            echo "\n🔄 Checking rollout status for StatefulSet/$sts..."
            if ! kubectl rollout status statefulset/$sts --timeout=${{ inputs.statefulset_timeout }}; then
              echo "❌ StatefulSet $sts rollout failed"
              ROLLOUT_FAILED=true
            else
              echo "✅ StatefulSet $sts deployment completed"
            fi
          done
        else
          echo "ℹ️  No StatefulSets found"
        fi

        # Deployments (always check, even if StatefulSets failed)
        DEPLOYMENTS=$(yq -N e 'select(.kind == "Deployment") | .metadata.name' manifests.yaml 2>/dev/null | grep -v '^---$' | tr '\n' ' ' || echo "")
        if [ -n "$DEPLOYMENTS" ]; then
          echo "\n📋 Found Deployments: $DEPLOYMENTS"
          for deploy in $DEPLOYMENTS; do
            # Extract namespace for this deployment (default to 'default')
            DEPLOY_NS=$(yq -N e "select(.kind == \"Deployment\" and .metadata.name == \"$deploy\") | .metadata.namespace // \"default\"" manifests.yaml 2>/dev/null | head -1)
            echo "\n🔄 Checking rollout status for Deployment/$deploy (namespace: $DEPLOY_NS)..."
            if ! kubectl rollout status deployment/$deploy -n "$DEPLOY_NS" --timeout=${{ inputs.deployment_timeout }}; then
              echo "❌ Deployment $deploy rollout failed"
              ROLLOUT_FAILED=true
            else
              echo "✅ Deployment $deploy deployment completed"
            fi
          done
        else
          echo "ℹ️  No Deployments found"
        fi

        # DaemonSets (always check)
        DAEMONSETS=$(yq -N e 'select(.kind == "DaemonSet") | .metadata.name' manifests.yaml 2>/dev/null | grep -v '^---$' | tr '\n' ' ' || echo "")
        if [ -n "$DAEMONSETS" ]; then
          echo "\n📋 Found DaemonSets: $DAEMONSETS"
          for ds in $DAEMONSETS; do
            echo "\n🔄 Checking rollout status for DaemonSet/$ds..."
            if ! kubectl rollout status daemonset/$ds --timeout=${{ inputs.daemonset_timeout }}; then
              echo "❌ DaemonSet $ds rollout failed"
              ROLLOUT_FAILED=true
            else
              echo "✅ DaemonSet $ds deployment completed"
            fi
          done
        else
          echo "ℹ️  No DaemonSets found"
        fi

        if [ "$ROLLOUT_FAILED" = "true" ]; then
          echo "rollout_success=false" >> $GITHUB_OUTPUT
        else
          echo "\n✅ All workloads deployed successfully"
          echo "rollout_success=true" >> $GITHUB_OUTPUT
        fi

    - name: Conditional rollback
      if: ${{ steps.rollout.outputs.rollout_success != 'true' && (inputs.rollback_on_failure == 'true' || inputs.statefulset_rollback == 'true') }}
      shell: bash
      run: |
        echo "🔄 Rollback enabled - discovering workloads from manifests"
        STATEFULSETS=$(yq -N e 'select(.kind == "StatefulSet") | .metadata.name' manifests.yaml 2>/dev/null | grep -v '^---$' | tr '\n' ' ' || echo "")
        for sts in $STATEFULSETS; do
          echo "\n🔄 Rolling back StatefulSet/$sts..."
          kubectl rollout undo statefulset/$sts || true
          kubectl rollout status statefulset/$sts --timeout=${{ inputs.statefulset_timeout }} || true
        done
        DEPLOYMENTS=$(yq -N e 'select(.kind == "Deployment") | .metadata.name' manifests.yaml 2>/dev/null | grep -v '^---$' | tr '\n' ' ' || echo "")
        for deploy in $DEPLOYMENTS; do
          # Extract namespace for this deployment (default to 'default')
          DEPLOY_NS=$(yq -N e "select(.kind == \"Deployment\" and .metadata.name == \"$deploy\") | .metadata.namespace // \"default\"" manifests.yaml 2>/dev/null | head -1)
          echo "\n🔄 Rolling back Deployment/$deploy (namespace: $DEPLOY_NS)..."
          kubectl rollout undo deployment/$deploy -n "$DEPLOY_NS" || true
          kubectl rollout status deployment/$deploy -n "$DEPLOY_NS" --timeout=${{ inputs.deployment_timeout }} || true
        done
        DAEMONSETS=$(yq -N e 'select(.kind == "DaemonSet") | .metadata.name' manifests.yaml 2>/dev/null | grep -v '^---$' | tr '\n' ' ' || echo "")
        for ds in $DAEMONSETS; do
          echo "\n🔄 Rolling back DaemonSet/$ds..."
          kubectl rollout undo daemonset/$ds || true
          kubectl rollout status daemonset/$ds --timeout=${{ inputs.daemonset_timeout }} || true
        done

    - name: Verify deployment
      if: ${{ always() }}
      shell: bash
      run: |
        echo "🔍 Verifying deployed resources"
        echo "\n📦 Workloads (labeled managed-by=kustomize):"
        kubectl get statefulset,deployment,daemonset -l app.kubernetes.io/managed-by=kustomize -o wide || echo "No workloads found"
        echo "\n🎯 Pods:"
        kubectl get pods -o wide || echo "No pods found"
        echo "\n🌐 Services (labeled managed-by=kustomize):"
        kubectl get services -l app.kubernetes.io/managed-by=kustomize || echo "No services found"
        echo "\n🌍 Ingress Controller (External Access):"
        kubectl get svc -n ingress-nginx ingress-nginx-controller -o wide || echo "Ingress controller not found"
        EXTERNAL_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
        if [ -n "$EXTERNAL_IP" ]; then
          echo "📌 Point your DNS (jaeger.dev.mysite.com, etc.) to: $EXTERNAL_IP"
        else
          echo "⚠️  LoadBalancer EXTERNAL-IP is <pending>"
          
          # TEMPORARY DEBUG: Check Cloud Controller Manager status
          echo "\n🔍 DEBUG: Checking Cloud Controller Manager..."
          CCM_PODS=$(kubectl get pods -n kube-system -l app.kubernetes.io/name=hcloud-cloud-controller-manager -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
          if [ -n "$CCM_PODS" ]; then
            echo "✅ CCM pods found: $CCM_PODS"
            kubectl get pods -n kube-system -l app.kubernetes.io/name=hcloud-cloud-controller-manager -o wide
            echo "\n🔍 DEBUG: CCM logs (last 30 lines):"
            for pod in $CCM_PODS; do
              kubectl logs -n kube-system $pod --tail=30 2>&1 | grep -i "loadbalancer\|error\|fail" || echo "No relevant errors in $pod"
            done
          else
            echo "❌ CCM not found in kube-system namespace"
            echo "   This is likely why LoadBalancer is pending"
            
            # TEMPORARY FIX: Install CCM if missing
            echo "\n🔧 TEMPORARY FIX: Installing Hetzner Cloud Controller Manager..."
            
            # Check if hcloud secret exists, if not create it with placeholder
            if ! kubectl get secret -n kube-system hcloud >/dev/null 2>&1; then
              echo "⚠️  hcloud secret missing - CCM cannot function without it"
              echo "   Manual action required: Recreate cluster with hetzner-k3s v2.4.1+"
            else
              echo "✅ hcloud secret exists - proceeding with CCM installation"
              kubectl apply -f https://github.com/hetznercloud/hcloud-cloud-controller-manager/releases/download/v1.20.0/ccm-networks.yaml
              echo "⏳ Waiting for CCM to be ready..."
              kubectl wait --for=condition=ready pod -n kube-system -l app.kubernetes.io/name=hcloud-cloud-controller-manager --timeout=60s || echo "CCM deployment may take longer"
              echo "✅ CCM installation attempted - LoadBalancer should provision shortly"
            fi
          fi
          
          echo "\n🔍 DEBUG: Checking hcloud secret..."
          kubectl get secret -n kube-system hcloud -o jsonpath='{.metadata.name}' 2>/dev/null && echo "✅ hcloud secret exists" || echo "❌ hcloud secret missing"
          
          echo "\n🔍 DEBUG: LoadBalancer service events..."
          kubectl describe svc -n ingress-nginx ingress-nginx-controller | grep -A 10 "Events:" || echo "No events found"
          
          echo "\n   Option 1: Use NodePort with worker node's public IP"
          WORKER_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}' 2>/dev/null || echo "")
          HTTP_PORT=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.spec.ports[?(@.name=="http")].nodePort}' 2>/dev/null || echo "")
          HTTPS_PORT=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.spec.ports[?(@.name=="https")].nodePort}' 2>/dev/null || echo "")
          if [ -n "$WORKER_IP" ]; then
            echo "   📌 Point DNS to: $WORKER_IP (HTTP:$HTTP_PORT, HTTPS:$HTTPS_PORT)"
          fi
        fi
        echo "\n💾 PVCs:"
        kubectl get pvc || echo "No PVCs found"

        echo "\n🌐 Ingress Resources:"
        kubectl get ingress -A || echo "No Ingresses found"

        echo "\n🔍 Ingress Details (with hosts and domains):"
        kubectl get ingress -A -o custom-columns="NAMESPACE:.metadata.namespace,NAME:.metadata.name,HOSTS:.spec.rules[*].host,ADDRESS:.status.loadBalancer.ingress[*].ip,TLS:.spec.tls[*].secretName" || echo "No detailed ingress info available"

        echo "\n📋 Ingress YAML (checking for placeholder issues):"
        for ing in $(kubectl get ingress -A -o jsonpath='{range .items[*]}{.metadata.namespace}{","}{.metadata.name}{"\n"}{end}'); do
          ns=$(echo $ing | cut -d',' -f1)
          name=$(echo $ing | cut -d',' -f2)
          echo "   Ingress: $ns/$name"
          kubectl get ingress -n $ns $name -o jsonpath='{.spec.rules[*].host}' && echo "" || echo "No host found"
          if kubectl get ingress -n $ns $name -o yaml | grep -q "PLACEHOLDER"; then
            echo "   ❌ WARNING: Found PLACEHOLDER in ingress configuration!"
            kubectl get ingress -n $ns $name -o yaml | grep "PLACEHOLDER" || true
          else
            echo "   ✅ No placeholders detected"
          fi
          
          # Check backend service exists
          backend_svc=$(kubectl get ingress -n $ns $name -o jsonpath='{.spec.rules[0].http.paths[0].backend.service.name}' 2>/dev/null || echo "")
          backend_port=$(kubectl get ingress -n $ns $name -o jsonpath='{.spec.rules[0].http.paths[0].backend.service.port.number}' 2>/dev/null || echo "")
          if [ -n "$backend_svc" ]; then
            echo "   📡 Backend: $backend_svc:$backend_port"
            if kubectl get svc -n $ns $backend_svc >/dev/null 2>&1; then
              echo "   ✅ Backend service exists"
              # Check if pods are backing the service
              endpoints=$(kubectl get endpoints -n $ns $backend_svc -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || echo "")
              if [ -n "$endpoints" ]; then
                echo "   ✅ Service has endpoints: $(echo $endpoints | wc -w) pod(s)"
              else
                echo "   ❌ Service has NO endpoints - no pods backing this service!"
              fi
            else
              echo "   ❌ Backend service NOT found"
            fi
          fi
          
          # Check TLS certificate status
          tls_secret=$(kubectl get ingress -n $ns $name -o jsonpath='{.spec.tls[0].secretName}' 2>/dev/null || echo "")
          if [ -n "$tls_secret" ]; then
            echo "   🔒 TLS Secret: $tls_secret"
            if kubectl get secret -n $ns $tls_secret >/dev/null 2>&1; then
              cert_data=$(kubectl get secret -n $ns $tls_secret -o jsonpath='{.data.tls\.crt}' 2>/dev/null || echo "")
              if [ -n "$cert_data" ]; then
                echo "   ✅ TLS certificate exists"
                # Check certificate expiry
                kubectl get certificate -n $ns 2>/dev/null | grep "$tls_secret" || echo "   ℹ️  No cert-manager Certificate resource found"
              else
                echo "   ❌ TLS secret exists but has no certificate data"
              fi
            else
              echo "   ⏳ TLS secret not ready yet (cert-manager provisioning)"
              
              # Check cert-manager Certificate resource
              echo "   🔍 Checking cert-manager resources..."
              if kubectl get certificate -n $ns >/dev/null 2>&1; then
                echo "   📜 Certificate resources:"
                kubectl get certificate -n $ns -o custom-columns="NAME:.metadata.name,READY:.status.conditions[?(@.type=='Ready')].status,SECRET:.spec.secretName,AGE:.metadata.creationTimestamp"
                
                # Check CertificateRequest status
                echo "   📋 CertificateRequest status:"
                kubectl get certificaterequest -n $ns -o custom-columns="NAME:.metadata.name,READY:.status.conditions[?(@.type=='Ready')].status,REASON:.status.conditions[?(@.type=='Ready')].reason,MESSAGE:.status.conditions[?(@.type=='Ready')].message"
                
                # Check for certificate errors
                cert_name=$(kubectl get certificate -n $ns -o jsonpath='{.items[?(@.spec.secretName=="'$tls_secret'")].metadata.name}' 2>/dev/null || echo "")
                if [ -n "$cert_name" ]; then
                  echo "   🔍 Certificate '$cert_name' events:"
                  kubectl describe certificate -n $ns $cert_name | grep -A 10 "Events:" || echo "No events found"
                fi
              else
                echo "   ❌ No Certificate resources found - cert-manager may not be installed"
                echo "   💡 Check if cert-manager is running:"
                kubectl get pods -n cert-manager 2>/dev/null || echo "   ❌ cert-manager namespace not found"
              fi
            fi
          fi
        done

        # Check for stuck pods and show detailed diagnostics
        STUCK_PODS=$(kubectl get pods --field-selector=status.phase!=Running,status.phase!=Succeeded -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
        if [ -n "$STUCK_PODS" ]; then
          echo "\n⚠️  Found pods not in Running state - showing diagnostics:"
          for pod in $STUCK_PODS; do
            echo "\n🔍 Pod: $pod"
            kubectl describe pod $pod | grep -A 20 "Events:" || true
          done
        fi

        if [ "${{ steps.pvc_cleanup.outputs.pvc_cleanup_ran }}" = "true" ]; then
          echo "\n📋 Recent pod events (PVC cleanup was executed):"
          kubectl get events --sort-by='.lastTimestamp' --field-selector involvedObject.kind=Pod | tail-30 || true
        fi

    - name: Mark failure if rollout did not succeed
      if: ${{ steps.rollout.outputs.rollout_success != 'true' }}
      shell: bash
      run: |
        echo "❌ Deployment failed or rollback executed"
        exit 1
