# yaml-language-server: disable
# Bright MLS Ingestion CronJob Patch for Hetzner Prod Environment
#
# PROD AUTHENTICATES AGAINST THE LICENSED PRODUCTION FEED (stakeholder ruling 2026-09-12, recorded
# on #117). This credential authenticates Real Broker, LLC's MLS participation against real licensed
# inventory: a leak, a value committed to Git, or licensed data reaching an unregistered display host
# are participation risks rather than ordinary incidents (PRD §6.2). Its blast radius is not the
# staging set's, even though the handling discipline is identical.
#
# The endpoint pair below is the PRODUCTION pair, reachability-checked with NO credentials (#163):
# the service root answers `401 WWW-Authenticate: Bearer`.
#
# THE TOKEN PATH IS INFERRED BY SYMMETRY WITH TEST, NOT CREDENTIAL-VERIFIED. Bright's production Okta
# org publishes two discovery documents and they disagree on the path. The org-level document at
# `https://okta.brightmls.com/.well-known/openid-configuration` reports `/oauth2/v1/token`; the
# `default` authorization server at `.../oauth2/default/.well-known/openid-configuration` reports
# `/oauth2/default/v1/token`, which is the value below. Test authenticates against its own `default`
# server, so `default` is the consistent choice — but nobody has held a production credential and
# proven it. If the first production token call returns 404 or `invalid_client`, drop `/default` and
# re-read those two documents before suspecting the credential. #117 item 5 is where that gets
# settled.
#
# Never copy a value between this file and the dev patch in either direction: identical field names
# with different values per environment is the whole mechanism, and a copied endpoint would point
# production at test data while every credential check still passed.
#
# Setting the endpoint does NOT start a production run. The CronJob stays suspended below, the prod
# secret is still the committed placeholder, and `infra/deploy-control.yaml` keeps this service
# `enabled: false` for prod. Three independent barriers; the endpoint is none of them.
#
# SUSPENDED until deliberately promoted. #117's rollout order is dev first and prod as a separate
# confirmation, never an assumption carried over from a green dev run; `infra/deploy-control.yaml`
# additionally keeps this service `enabled: false` for prod until then. #102 chooses the production
# hostnames and #117 item 6 confirms display-URL registration — neither is settled, and rendering
# licensed inventory from an unregistered host is the failure this suspension prevents.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: bright-mls-ingest
spec:
  schedule: "0 3 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ingest
              image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:latest
              # `Always`, not `IfNotPresent`, because nothing re-pulls for a CronJob. The deploy
              # action's staleness mechanism is `kubectl rollout restart` driven by
              # `restart-deployments.txt`, which `tools/infra/deploy-scope.js` populates from
              # `kind == "Deployment"` only. With a mutable `:latest` tag and `IfNotPresent`, the
              # nightly run would keep executing whatever layer the node happened to cache at
              # first pull — indefinitely, and with no signal anywhere that it had gone stale.
              imagePullPolicy: Always
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              env:
                - name: NODE_ENV
                  value: "production"
                # Bright LICENSED PRODUCTION feed. Verified 2026-09-18 (#163). Never copied from dev.
                - name: BRIGHT_MLS_TOKEN_ENDPOINT
                  value: "https://okta.brightmls.com/oauth2/default/v1/token"
                - name: BRIGHT_MLS_SERVICE_ROOT
                  value: "https://bright-reso.brightmls.com/RESO/OData/bright"
                # The ONLY place in the repo that declares the production tier. The base default is
                # `test`, and that default is fail-safe: an environment that forgets to patch this
                # cannot read the production feed.
                - name: BRIGHT_MLS_ENV
                  value: "production"
                # Pre-#246 name for the same declaration, kept for one release (#246 migration
                # step 2). config.ts reads BRIGHT_MLS_ENV first.
                - name: BRIGHT_MLS_FEED
                  value: "production"
