# yaml-language-server: disable
# Bright MLS Ingestion CronJob Patch for Hetzner Prod Environment
#
# WHICH FEED: the one this environment's `bright-mls-secret` declares in BRIGHT_MLS_ENV. Endpoints
# follow the tier (config.ts → BRIGHT_FEED_ENDPOINTS), so nothing here names a host. The production
# token path `/oauth2/default/v1/token` authenticated a real production credential on 2026-09-22.
#
# The production credential authenticates Real Broker, LLC's MLS participation against real licensed
# inventory: a leak, a value committed to Git, or licensed data reaching an unregistered display host
# are participation risks rather than ordinary incidents (PRD §6.2).
#
# SUSPENDED until deliberately promoted; `infra/deploy-control.yaml` additionally keeps this service
# `enabled: false` for prod. #102 chooses the production hostnames and #117 item 6 confirms
# display-URL registration — neither is settled, and rendering licensed inventory from an
# unregistered host is the failure this suspension prevents.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: bright-mls-ingest
spec:
  schedule: "0 3 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ingest
              image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:latest
              # `Always`, not `IfNotPresent`, because nothing re-pulls for a CronJob. The deploy
              # action's staleness mechanism is `kubectl rollout restart` driven by
              # `restart-deployments.txt`, which `tools/infra/deploy-scope.js` populates from
              # `kind == "Deployment"` only. With a mutable `:latest` tag and `IfNotPresent`, the
              # nightly run would keep executing whatever layer the node happened to cache at
              # first pull — indefinitely, and with no signal anywhere that it had gone stale.
              imagePullPolicy: Always
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              env:
                - name: NODE_ENV
                  value: "production"
