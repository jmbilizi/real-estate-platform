# Jaeger Sampling Strategies Patch for Prod Environment
# Overrides base 100% sampling to 5% (performance optimized)

apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  labels:
    app: jaeger
data:
  sampling.json: |
    {
      "service_strategies": [],
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.05
      }
    }
