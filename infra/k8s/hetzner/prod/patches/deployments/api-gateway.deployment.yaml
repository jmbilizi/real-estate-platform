# yaml-language-server: disable
# API Gateway Deployment Patch for Hetzner Prod Environment
# Production-grade resources with HA
# OTEL Sampling: 5% (performance optimized)
# Environment: Production

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 3 # HA with 3 replicas for production
  selector:
    matchLabels:
      app: api-gateway
  template:
    spec:
      containers:
        - name: ocelot
          # Image is updated by CI/CD workflow with actual GHCR URL and prod tag
          # Format: ghcr.io/<owner>/<repo>/api-gateway:latest
          # Placeholders: GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/api-gateway:latest
          imagePullPolicy: IfNotPresent # Production uses immutable tags
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: OTEL_ENABLED # OTEL = OpenTelemetry
              value: "true" # Enable tracing in prod (set to "false" to disable)
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.05" # 5% sampling for prod (adjust based on traffic)
