# yaml-language-server: disable
# Cribstop Web Deployment Patch for Hetzner Prod Environment
# Production-grade resources with HA
# Environment: Production

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cribstop-web
spec:
  replicas: 3 # HA with 3 replicas for production
  selector:
    matchLabels:
      app: cribstop-web
  template:
    spec:
      containers:
        - name: nextjs
          # Format: ghcr.io/<owner>/<repo>/cribstop-web:latest
          # Placeholders: GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/cribstop-web:latest
          imagePullPolicy: IfNotPresent # Production uses immutable tags
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: NODE_ENV
              value: "production"
