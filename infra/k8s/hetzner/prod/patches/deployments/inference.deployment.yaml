# yaml-language-server: disable
# Inference Deployment Patch for Hetzner Prod Environment
# Production-grade resources

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
spec:
  replicas: 3 # HA with 3 replicas for production
  selector:
    matchLabels:
      app: inference
  template:
    spec:
      containers:
        - name: api
          # Format: ghcr.io/<owner>/<repo>/inference:latest
          # Placeholders: GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/inference-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
