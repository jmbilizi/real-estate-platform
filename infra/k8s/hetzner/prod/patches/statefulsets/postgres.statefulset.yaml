# yaml-language-server: disable
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-hl
  selector:
    matchLabels:
      app: postgres
  replicas: 1 # The base has no replication. Each extra pod is an independent database.
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          # Built image (PostGIS + pgvector) — see infra/docker/postgres/Dockerfile.
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/postgres-postgis-pgvector:latest
          # Same as dev: the Bright sync worker starves a smaller database (#388).
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1500m"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 20Gi # Storage is cheap (~€2/month), running out is expensive
