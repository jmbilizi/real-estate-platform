# #954: keeps at least one account-service pod Ready through a voluntary disruption (node drain,
# cluster upgrade). This overlay runs more than one replica. Dev runs one, where a budget would
# block drains. Carries the `app` label that deploy-control uses to select the service.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: account-service
  labels:
    app: account-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: account-service
