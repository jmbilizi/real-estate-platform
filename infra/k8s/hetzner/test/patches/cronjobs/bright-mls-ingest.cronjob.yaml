# yaml-language-server: disable
# Bright MLS Ingestion CronJob Patch for Hetzner Test Environment
#
# WHICH FEED: the one this environment's GitHub environment secrets declare in BRIGHT_MLS_ENV
# (`test` or `production`), with BRIGHT_MLS_CLIENT_ID / BRIGHT_MLS_CLIENT_SECRET for that tier.
# Endpoints follow the tier (config.ts → BRIGHT_FEED_ENDPOINTS), so nothing here names a host.
#
# CURSOR (#232, supersedes the "load from the default epoch" note this comment used to carry): test
# is not production and does not need full feed history either. Loading from the epoch with no page
# cap under `activeDeadlineSeconds: 900` and `concurrencyPolicy: Forbid` repeats a full backfill on
# every tick and never completes (#231). Same bounded window as dev and local: the test feed reports
# 1,461 `BrightProperties` modified since this instant (#92). The replication PATH is unchanged —
# only the starting point and per-run page count are bounded, same as dev.
#
# SCHEDULE (#224): raised from once a day to every 15 minutes, offset 7 minutes from dev's `*/15`,
# so a mapping fix reaches test within minutes instead of a day. Dev and test still read the same
# Bright test feed under one shared rate limit, so the offset keeps their runs from overlapping.
# Prod is licensed production inventory on its own conservative cadence and is unaffected.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: bright-mls-ingest
spec:
  schedule: "7-59/15 * * * *"
  suspend: false
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ingest
              image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:test
              imagePullPolicy: Always
              env:
                - name: NODE_ENV
                  value: "production"
                - name: BRIGHT_MLS_INITIAL_CURSOR
                  value: "2026-09-01T00:00:00Z"
                - name: BRIGHT_MLS_MAX_PAGES_PER_RUN
                  value: "25"
