# yaml-language-server: disable
# Bright Area Reconciliation CronJob Patch for Hetzner Test Environment (#331)
#
# WHICH FEED: the one this environment's BRIGHT_MLS_ENV secret declares, same as bright-mls-ingest.
#
# SCHEDULE: daily, offset from dev's reconciliation run.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: bright-area-reconcile
spec:
  schedule: "45 5 * * *"
  suspend: false
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: reconcile
              image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:test
              imagePullPolicy: Always
              env:
                - name: NODE_ENV
                  value: "production"
