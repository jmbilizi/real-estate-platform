# yaml-language-server: disable
# Bright Sync Worker Deployment Patch for Hetzner Test Environment (#338)
#
# WHICH FEED: the one this environment's GitHub environment secrets declare in BRIGHT_MLS_ENV
# (`test` or `production`), with BRIGHT_MLS_CLIENT_ID / BRIGHT_MLS_CLIENT_SECRET for that tier.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bright-sync-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:test
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: NODE_ENV
              value: "production"
            # #315's rule: NODE_OPTIONS follows limits.memory / 1.5.
            # tools/infra/node-heap-ratio.js checks this ratio against the limit above.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=341"
