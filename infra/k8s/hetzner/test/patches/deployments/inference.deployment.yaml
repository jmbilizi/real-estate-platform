# yaml-language-server: disable
# Inference Deployment Patch for Hetzner Test Environment
# Medium resources for staging testing

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
spec:
  replicas: 2 # HA for realistic testing
  selector:
    matchLabels:
      app: inference
  template:
    spec:
      containers:
        - name: api
          # Format: ghcr.io/<owner>/<repo>/inference:test
          # Placeholders: GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/inference-service:test
          imagePullPolicy: Always
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
