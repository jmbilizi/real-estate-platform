# yaml-language-server: disable
# Cribstop Web Deployment Patch for Hetzner Test Environment
# Medium resources for staging testing
# Environment: Staging

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cribstop-web
spec:
  replicas: 2 # HA for realistic testing
  selector:
    matchLabels:
      app: cribstop-web
  template:
    spec:
      containers:
        - name: nextjs
          # Format: ghcr.io/<owner>/<repo>/cribstop-web:test
          # Placeholders: GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/cribstop-web:test
          imagePullPolicy: Always # Always pull latest test image
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          env:
            - name: NODE_ENV
              value: "production"
