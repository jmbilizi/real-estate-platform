# yaml-language-server: disable
# API Gateway Deployment Patch for Hetzner Test Environment
# Medium resources for staging testing
# OTEL Sampling: 50% (balance between visibility and performance)
# Environment: Staging

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2 # HA for realistic testing
  selector:
    matchLabels:
      app: api-gateway
  template:
    spec:
      containers:
        - name: ocelot
          # Image is updated by CI/CD workflow with actual GHCR URL and test tag
          # Format: ghcr.io/<owner>/<repo>/api-gateway:test
          # Placeholders: GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/api-gateway:test
          imagePullPolicy: Always # Always pull latest test image
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Staging"
            - name: OTEL_ENABLED # OTEL = OpenTelemetry
              value: "true" # Enable tracing in test
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.5" # 50% sampling for test
            - name: GEOIP_ENABLED # GeoIP geographic enrichment
              value: "true" # Uses standard path: /opt/geoip/GeoLite2-City.mmdb
            # Derived from infra/deploy-control.yaml, NOT hand-authored: account-service and
            # property-service are both `enabled: false` for test, so advertising their routes
            # would serve 502 on the routes and 500 on /swagger/docs/v1/<Service> — which takes
            # out the whole Swagger aggregation endpoint (#22, #71). `pnpm run infra:validate`
            # recomputes this set and fails if this value is not exactly right, in either
            # direction. Delete an entry here when its service is enabled for test.
            - name: GATEWAY_DISABLED_SERVICES
              value: "Account,Property"
