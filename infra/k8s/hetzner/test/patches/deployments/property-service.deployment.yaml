# yaml-language-server: disable
# Property Service Deployment Patch for Hetzner Test Environment
# Medium resources for staging testing

apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: property-service
  template:
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:test
          imagePullPolicy: Always
      containers:
        - name: api
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:test
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: NODE_ENV
              value: "production"
