# yaml-language-server: disable
# Account Service Deployment Patch for Hetzner Test Environment
# Medium resources for staging testing

apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  template:
    spec:
      containers:
        - name: api
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/account-service:test
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Staging"
