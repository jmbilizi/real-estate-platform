# yaml-language-server: disable
# Account Service Deployment Patch for Hetzner Test Environment
# Medium resources for staging testing

apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  template:
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/account-service:test
          imagePullPolicy: Always
      containers:
        - name: api
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/account-service:test
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Staging"
            # Email confirmation is not enforced yet (#147). #149 turns it on.
            - name: AccountRecovery__RequireConfirmedEmail
              value: "false"
            # Public origin of the web app. The deploy action substitutes the placeholder.
            - name: AccountRecovery__WebBaseUrl
              value: "https://CRIBSTOP_DOMAIN_PLACEHOLDER"
