apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cribstop-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod # TLS cert for test
    # Basic auth in test only (#256). Not on prod: the public web app stays open there.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: api-gateway-secret
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required - Cribstop Web (test)"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - CRIBSTOP_DOMAIN_PLACEHOLDER
      secretName: cribstop-web-test-tls
  rules:
    - host: CRIBSTOP_DOMAIN_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cribstop-web-svc
                port:
                  number: 3000
