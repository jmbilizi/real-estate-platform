# Jaeger Sampling Strategies Patch for Test Environment
# Overrides base 100% sampling to 10% (realistic load simulation)

apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  labels:
    app: jaeger
data:
  sampling.json: |
    {
      "service_strategies": [],
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.1
      }
    }
