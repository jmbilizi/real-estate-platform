apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cribstop-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod # TLS cert for dev
    # Basic auth in dev only (#255). Same credential as jaeger/api-gateway. Not on
    # prod: the public web app stays open there.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: ingress-secret
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required - Cribstop Web (dev)"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - CRIBSTOP_DOMAIN_PLACEHOLDER
      secretName: cribstop-web-dev-tls
  rules:
    - host: CRIBSTOP_DOMAIN_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cribstop-web-svc
                port:
                  number: 3000
