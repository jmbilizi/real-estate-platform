apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod # TLS cert for dev
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - API_GATEWAY_DOMAIN_PLACEHOLDER
      secretName: api-gateway-dev-tls
  rules:
    - host: API_GATEWAY_DOMAIN_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway-svc
                port:
                  number: 8080
---
# Same host and TLS secret as api-gateway. The certificate comes from the api-gateway Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: account-postmark-webhook
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - API_GATEWAY_DOMAIN_PLACEHOLDER
      secretName: api-gateway-dev-tls
  rules:
    - host: API_GATEWAY_DOMAIN_PLACEHOLDER
      http:
        paths:
          - path: /account/webhooks/postmark
            pathType: Exact
            backend:
              service:
                name: api-gateway-svc
                port:
                  number: 8080
