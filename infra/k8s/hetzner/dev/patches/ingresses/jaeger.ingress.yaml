apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  annotations:
    # TLS via cert-manager (production issuer for dev too)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - JAEGER_DOMAIN_PLACEHOLDER
      secretName: jaeger-dev-tls
  rules:
    - host: JAEGER_DOMAIN_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger-svc
                port:
                  number: 16686
