# Jaeger Sampling Strategies Patch for Dev Environment
# Overrides base 100% sampling to 50% (reduces storage/memory pressure)
# 50% still provides good debugging visibility for development

apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  labels:
    app: jaeger
data:
  sampling.json: |
    {
      "service_strategies": [],
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.5
      }
    }
