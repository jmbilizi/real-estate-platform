# yaml-language-server: disable
# Jaeger StatefulSet Patch for Hetzner Dev Environment
# Adds minimal resources and storage for development use
# Retention: 2 days (keeps storage manageable on 2Gi volume)
# Sampling: 50% via configmap patch (balance debugging visibility with resource use)

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jaeger
spec:
  serviceName: jaeger-hl
  selector:
    matchLabels:
      app: jaeger
  replicas: 1 # Single instance for dev
  template:
    spec:
      containers:
        - name: jaeger
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: BADGER_SPAN_STORE_TTL
              value: "48h" # 2 days retention for dev (keeps storage manageable)
  volumeClaimTemplates:
    - metadata:
        name: jaeger-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hcloud-volumes # Hetzner CSI driver
        resources:
          requests:
            storage: 2Gi
