# yaml-language-server: disable
# Dev environment configuration: Lower resources for cost efficiency
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-hl
  selector:
    matchLabels:
      app: postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          # Built image (PostGIS + pgvector) — see infra/docker/postgres/Dockerfile.
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/postgres-postgis-pgvector:dev
          # Raised from 250m/512Mi limits (#388): the sync worker's concurrent applies starved
          # every DB on this instance, pushing property-service queries past the gateway's 5 s
          # QoS timeout. cpx21 dev nodes have 3 vCPU / 4 GB headroom for this.
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1500m"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 14Gi
