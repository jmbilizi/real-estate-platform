# yaml-language-server: disable
# Inference Deployment Patch for Hetzner Dev Environment
# Low resources for development cluster

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference
  template:
    spec:
      containers:
        - name: api
          # Format: ghcr.io/<owner>/<repo>/inference:dev
          # Placeholders: GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/inference-service:dev
          imagePullPolicy: Always
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
