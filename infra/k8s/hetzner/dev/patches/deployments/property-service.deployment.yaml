# yaml-language-server: disable
# Property Service Deployment Patch for Hetzner Dev Environment
# Low resources for development cluster

apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: property-service
  template:
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:dev
          imagePullPolicy: Always
          # No sample inventory is seeded any more: search runs on Bright MLS data, and migration
          # 1785801600027 removed the seeded mock listings (2026-09-23). NODE_ENV stays development
          # because the runtime image bakes NODE_ENV=production and this override is the only one
          # that reaches the initContainer.
          env:
            - name: NODE_ENV
              value: "development"
          # Raised only where seeding runs. The base 128Mi limit was sized for ONE short-lived
          # migration process; seeding spawns a second Node process while migrate.js is still
          # resident, so two Node runtimes share this cgroup. Exceeding it is a SIGKILL, which
          # surfaces as a failed initContainer on every boot. test/prod never seed and stay at 128Mi.
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
      containers:
        - name: api
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:dev
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: NODE_ENV
              value: "development"
