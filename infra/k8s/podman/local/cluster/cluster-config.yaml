# LOCAL CLUSTER CONFIGURATION (Kind + Podman)
# ------------------------------------------
# Edit ONLY the fields below to control your local Kubernetes cluster.
# Everything else (CA install, Kind creation, manifest apply) is automated by
# tools/infra/setup-local-cluster.js.
#
# USAGE:
#   pnpm run infra:local:cluster:setup   # Create or repair cluster
#   pnpm run infra:local:cluster:delete  # Delete cluster
#
# For application deployment controls, see infra/deploy-control.yaml.

# Kubernetes version Kind should use (must match a published kindest/node tag)
kubernetes_version: v1.28.0

# Name for your local cluster (also used for kubectl context: kind-<name>)
cluster_name: myapp-podman-local

# Number of nodes (1 = control-plane only, 2+ adds workers)
nodes: 1

# Resources PER NODE (Kind reuses the Podman machine, so total = nodes * values)
resources:
  # CPU cores per node
  cpus: 2
  # Memory in MB per node (3GB default)
  memory: 3072
  # Disk size per node (affects Podman machine disk allocation)
  disk: 20g

# (Optional) List of insecure registries Podman should trust for local dev
registries:
  insecure:
    - gcr.io
    - docker.io
    - registry.k8s.io
    - ghcr.io
