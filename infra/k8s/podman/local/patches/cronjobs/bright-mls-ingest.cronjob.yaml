# yaml-language-server: disable
# Bright MLS Ingestion CronJob Patch for Podman Local Environment
#
# WHICH FEED: the one you hold credentials for. #160's local secret injection copies the Bright keys
# from `.env` into this cluster's `bright-mls-secret`. Set `BRIGHT_MLS_ENV` (`test` or `production`)
# and `BRIGHT_MLS_CLIENT_ID` / `BRIGHT_MLS_CLIENT_SECRET` for that tier. The endpoints follow the
# tier (config.ts → BRIGHT_FEED_ENDPOINTS), so nothing here names a host. No values in `.env` give
# the committed placeholders and a `not_configured` run.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: bright-mls-ingest
spec:
  schedule: "0 * * * *"
  suspend: false
  jobTemplate:
    spec:
      # Raised from the base 900s to fit one whole BrightMedia pass (#191). A pass is about 28
      # minutes at the default rate. The base deadline would kill every run part way, and a
      # half-finished pass reads as a failed Job rather than as a cap.
      activeDeadlineSeconds: 3000
      template:
        spec:
          # Mounts the enterprise CA ConfigMap (#180) — same mechanism and same reasoning as the
          # property-service Deployment patch. Without it the Bright OAuth2 token call fails at the
          # transport layer with "unable to get local issuer certificate" under a TLS-intercepting
          # corporate proxy, before any credential is even checked.
          volumes:
            - name: workspace-ca-bundle
              configMap:
                name: workspace-ca-bundle
          containers:
            - name: ingest
              image: property-service
              imagePullPolicy: IfNotPresent
              # A page is up to 1000 BrightProperty records of 931 fields each, held as a body
              # string, parsed objects and a JSON copy per insert chunk at the same time. 192Mi
              # OOMKills the container mid-page, which looks like a vanished pod, not a job error.
              resources:
                requests:
                  memory: "192Mi"
                  cpu: "25m"
                limits:
                  memory: "768Mi"
                  cpu: "400m"
              volumeMounts:
                - name: workspace-ca-bundle
                  mountPath: /etc/workspace-ca
                  readOnly: true
              # NODE_ENV is repeated here for the same reason the property-service migrate
              # initContainer repeats it: the runtime image bakes NODE_ENV=production, and there is
              # no other container's override to inherit.
              env:
                - name: NODE_ENV
                  value: "development"
                - name: NODE_EXTRA_CA_CERTS
                  value: "/etc/workspace-ca/workspace-enterprise-roots.pem"
                # A laptop cluster must come up with real rows in minutes. dev and test use this same
                # bounded cursor (#239) — none of the three needs full feed history.
                - name: BRIGHT_MLS_INITIAL_CURSOR
                  value: "2026-09-01T00:00:00Z"
                - name: BRIGHT_MLS_MAX_PAGES_PER_RUN
                  value: "25"
                # ── The BrightMedia full crawl (#191) ────────────────────────────────────────
                # Without this, mapped listings carry no photo and every card renders the "No
                # photo available" placeholder. `BrightMedia` answers 400 to every `$filter` on
                # this tier, so the only way to reach a listing's photos is to read the whole
                # resource and match client-side. The crawl stages only the rows whose
                # `ResourceRecordKey` matches a `ListingKey` already staged above, so
                # `property_db` stays small. The traffic is the cost, not the storage.
                #
                # COST, and why the cap is a whole pass. 3,403,084 rows at 1000 per page is
                # roughly 3,400 requests. At the 2 req/s default that is about 28 minutes. The
                # cap is set above that so one run completes one pass, and `activeDeadlineSeconds`
                # below is raised to fit. A lower cap still works — the pass resumes from the
                # stored next link — but then a photo can take days to appear, which reads as the
                # feature not working.
                #
                # The rate numbers this rests on are placeholders, not the agreement's limits.
                # #33 item 3 records the real ones. Lower this cap if they turn out lower.
                - name: BRIGHT_MLS_CRAWL_RESOURCES
                  value: "BrightMedia"
                - name: BRIGHT_MLS_CRAWL_MAX_PAGES_PER_RUN
                  value: "3600"
