# yaml-language-server: disable
# Bright MLS Ingestion CronJob Patch for Podman Local Environment
#
# LOCAL AUTHENTICATES AGAINST BRIGHT'S TEST/STAGING FEED (stakeholder ruling 2026-09-19). The ruling
# supersedes the part of #117 that kept local on seeded `source='internal'` rows only. Local, dev and
# test all read the test feed now. The invariant that survives is unchanged: the production
# credential never leaves prod.
#
# The mechanism is #160's local secret injection. It derives its injectable keys from every
# `stringData` key under `infra/k8s/base/secrets/`, which includes both Bright keys. A developer who
# puts test-feed credentials in `.env` gets them in this cluster's `bright-mls-secret`. A developer
# who does not gets the committed placeholder and a `not_configured` run.
#
# Do NOT substitute `brightmls.test.okta.com` for the token host. Okta serves the wildcard
# `*.okta.com`, which cannot match a three-label name, so TLS fails permanently.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: bright-mls-ingest
spec:
  schedule: "0 * * * *"
  suspend: false
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ingest
              image: property-service
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "25m"
                limits:
                  memory: "192Mi"
                  cpu: "200m"
              # NODE_ENV is repeated here for the same reason the property-service migrate
              # initContainer repeats it: the runtime image bakes NODE_ENV=production, and there is
              # no other container's override to inherit.
              env:
                - name: NODE_ENV
                  value: "development"
                # Bright TEST/STAGING feed. Verified live 2026-09-18 (#163).
                - name: BRIGHT_MLS_TOKEN_ENDPOINT
                  value: "https://okta.tst.brightmls.com/oauth2/default/v1/token"
                - name: BRIGHT_MLS_SERVICE_ROOT
                  value: "https://bright-reso.tst.brightmls.com/RESO/OData/bright"
                - name: BRIGHT_MLS_FEED
                  value: "test"
                # A laptop cluster must come up with real rows in minutes. This cursor is a local
                # convenience only. dev and test load from the default epoch. The test feed reports
                # 1,461 `BrightProperties` modified since this instant (#92).
                - name: BRIGHT_MLS_INITIAL_CURSOR
                  value: "2026-09-01T00:00:00Z"
                - name: BRIGHT_MLS_MAX_PAGES_PER_RUN
                  value: "5"
