# yaml-language-server: disable
# API Gateway Deployment Patch for Podman Local Environment
# Minimal resources for local development
# OTEL Sampling: 100% (trace everything)
# Environment: Development

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    spec:
      containers:
        - name: ocelot
          # Skaffold manages image name - use 'api-gateway' to match skaffold.yaml
          image: api-gateway
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0" # 100% sampling for local dev
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
