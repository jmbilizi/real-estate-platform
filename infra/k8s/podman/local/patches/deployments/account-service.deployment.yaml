# yaml-language-server: disable
# Account Service Deployment Patch for Podman Local Environment
# Minimal resources for local development

apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    spec:
      initContainers:
        - name: migrate
          image: account-service
      containers:
        - name: api
          image: account-service
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            # Email confirmation is not enforced yet (#147). #149 turns it on.
            - name: AccountRecovery__RequireConfirmedEmail
              value: "false"
            # Public origin of the web app. Confirmation links point here (#147).
            - name: AccountRecovery__WebBaseUrl
              value: "http://localhost:3000"
