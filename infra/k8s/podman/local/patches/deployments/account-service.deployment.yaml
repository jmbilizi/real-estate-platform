# yaml-language-server: disable
# Account Service Deployment Patch for Podman Local Environment
# Minimal resources for local development

apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    spec:
      containers:
        - name: api
          image: account-service
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
