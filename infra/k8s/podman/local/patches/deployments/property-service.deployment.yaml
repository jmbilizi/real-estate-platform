# yaml-language-server: disable
# Property Service Deployment Patch for Podman Local Environment
# Minimal resources for local development

apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: property-service
  template:
    spec:
      initContainers:
        - name: migrate
          image: property-service
          # No sample inventory is seeded any more: search runs on Bright MLS data, and migration
          # 1785801600027 removed the seeded mock listings (2026-09-23). NODE_ENV stays development
          # because the runtime image bakes NODE_ENV=production and this override is the only one
          # that reaches the initContainer.
          env:
            - name: NODE_ENV
              value: "development"
            # Local-only recovery from a renumbered migration file (#223): a `pgmigrations` row
            # with no matching file is stale local state here, never real deploy history. Only
            # this overlay sets it — not hetzner/dev, which is a persistent environment where the
            # same row would be genuine history.
            - name: PROPERTY_SERVICE_MIGRATION_SELF_HEAL
              value: "1"
          # Raised only where seeding runs. The base 128Mi limit was sized for ONE short-lived
          # migration process; seeding spawns a second Node process while migrate.js is still
          # resident, so two Node runtimes share this cgroup. Exceeding it is a SIGKILL, which
          # surfaces as a failed initContainer on every boot. test/prod never seed and stay at 128Mi.
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
      # Mounts the enterprise CA ConfigMap (#180) so the container's own filesystem carries the
      # trust the Kind node's OS trust store cannot pass through. Empty on a workstation with no
      # corporate TLS-intercepting proxy — see workspace-ca-bundle.configmap.yaml.
      volumes:
        - name: workspace-ca-bundle
          configMap:
            name: workspace-ca-bundle
      containers:
        - name: api
          image: property-service
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: workspace-ca-bundle
              mountPath: /etc/workspace-ca
              readOnly: true
          env:
            - name: NODE_ENV
              value: "development"
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/workspace-ca/workspace-enterprise-roots.pem"
