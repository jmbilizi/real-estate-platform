# yaml-language-server: disable
# Property Service Deployment Patch for Podman Local Environment
# Minimal resources for local development

apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: property-service
  template:
    spec:
      initContainers:
        - name: migrate
          image: property-service
          # Sample inventory is loaded here, right after migrations, so a local cluster comes up with
          # a populated property_db and no workstation credential step (#111). Only this overlay and
          # hetzner/dev set the flag; hetzner/test and hetzner/prod never do.
          #
          # NODE_ENV is repeated here because the runtime image bakes NODE_ENV=production
          # (see the property-service Dockerfile) and the api container's override does not reach an
          # initContainer — without it the seed's production refusal fires and nothing is loaded.
          env:
            - name: NODE_ENV
              value: "development"
            - name: PROPERTY_SERVICE_SEED_ON_START
              value: "1"
      containers:
        - name: api
          image: property-service
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: NODE_ENV
              value: "development"
