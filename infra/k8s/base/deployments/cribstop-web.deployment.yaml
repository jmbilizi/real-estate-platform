apiVersion: apps/v1
kind: Deployment
metadata:
  name: cribstop-web
  namespace: default
  labels:
    app: cribstop-web
spec:
  # Patches can confirm or override this default replica count
  replicas: 1
  selector:
    matchLabels:
      app: cribstop-web
  template:
    metadata:
      labels:
        app: cribstop-web
    spec:
      containers:
        - name: nextjs
          # Image format: ghcr.io/<owner>/<repo>/cribstop-web:<tag>
          # CI/CD workflow substitutes GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
          # Local development uses Skaffold override (see podman/local/patches)
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/cribstop-web:latest
          imagePullPolicy: IfNotPresent
          # Patches can confirm or override these minimal resource settings
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            # Server-side only — used by Next.js API routes to reach the gateway.
            # The TRAILING DOT is load-bearing, not a typo: it makes the name absolute.
            # Without it the name has 4 dots, and `ndots:5` (see any pod's /etc/resolv.conf)
            # makes the resolver walk the search list FIRST. On a workstation whose search
            # list carries corporate domains, a wildcard record there answers
            # `…cluster.local.<corp-domain>` with a PUBLIC IP, and every gateway call then
            # hangs until it times out — observed as a 503 from /api/listings.
            # Verified in-cluster on both libcs: the bare 4-dot form resolves correctly under
            # musl (which ignores ndots) but is hijacked under glibc, while the short name
            # behaves the other way round (EAI_AGAIN under musl). Only this absolute form
            # resolves to the ClusterIP under both, so it survives a future base-image change.
            - name: API_GATEWAY_URL
              value: "http://api-gateway-svc.default.svc.cluster.local.:8080"
            # Kubernetes metadata (Downward API)
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
