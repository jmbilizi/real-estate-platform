apiVersion: apps/v1
kind: Deployment
metadata:
  name: cribstop-web
  namespace: default
  labels:
    app: cribstop-web
spec:
  # Patches can confirm or override this default replica count
  replicas: 1
  selector:
    matchLabels:
      app: cribstop-web
  template:
    metadata:
      labels:
        app: cribstop-web
    spec:
      containers:
        - name: nextjs
          # Image format: ghcr.io/<owner>/<repo>/cribstop-web:<tag>
          # CI/CD workflow substitutes GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
          # Local development uses Skaffold override (see podman/local/patches)
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/cribstop-web:latest
          imagePullPolicy: IfNotPresent
          # Patches can confirm or override these minimal resource settings
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            # NEXT_PUBLIC_API_URL: Defined in patches (points to API Gateway per environment)
            # Kubernetes metadata (Downward API)
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
