apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-service
  namespace: default
  labels:
    app: property-service
spec:
  replicas: 1
  # #388: a rolling update never drops below the pre-update replica count (maxUnavailable: 0), so
  # search stays up through a deploy. It costs one extra pod (maxSurge: 1) only for the rollout's
  # duration.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: property-service
  template:
    metadata:
      labels:
        app: property-service
    spec:
      initContainers:
        - name: migrate
          # Same image as the main container — reuses the built bundle and the
          # migrations/ directory the Dockerfile copies in.
          # migrate.js retries transient startup failures the way account-service's
          # MigrateWithRetryAsync does, so a cold cluster does not fail the deploy.
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "migrate.js"]
          env:
            - name: PROPERTY_DB_HOST
              value: "postgres-svc"
            - name: PROPERTY_DB_PORT
              value: "5432"
            - name: PROPERTY_DB_NAME
              value: "property_db"
            - name: PROPERTY_DB_USER
              value: "property_service_db_user"
            - name: PROPERTY_SERVICE_DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PROPERTY_SERVICE_DB_USER_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(PROPERTY_DB_USER):$(PROPERTY_SERVICE_DB_USER_PASSWORD)@$(PROPERTY_DB_HOST):$(PROPERTY_DB_PORT)/$(PROPERTY_DB_NAME)"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      containers:
        - name: api
          # Image format: ghcr.io/<owner>/<repo>/property-service:<tag>
          # CI/CD workflow substitutes GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
          # Local development uses Skaffold override (see podman/local/patches)
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            - name: PORT
              value: "3002"
            - name: HOST
              value: "0.0.0.0"
            # DB values are aligned with infra/k8s/base/configmaps/postgres.configmap.yaml
            - name: PROPERTY_DB_HOST
              value: "postgres-svc"
            - name: PROPERTY_DB_PORT
              value: "5432"
            - name: PROPERTY_DB_NAME
              value: "property_db"
            - name: PROPERTY_DB_USER
              value: "property_service_db_user"
            - name: PROPERTY_SERVICE_DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PROPERTY_SERVICE_DB_USER_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(PROPERTY_DB_USER):$(PROPERTY_SERVICE_DB_USER_PASSWORD)@$(PROPERTY_DB_HOST):$(PROPERTY_DB_PORT)/$(PROPERTY_DB_NAME)"
            # Listing-detail gallery fetch only (#338, src/listings/on-demand.ts): a listing with
            # no local media fetches its gallery from Bright. bright-sync-worker holds these same
            # three keys for the sync itself. The committed placeholders turn the fetch off, so an
            # unprovisioned environment just serves whatever media it already has.
            - name: BRIGHT_MLS_ENV
              valueFrom:
                secretKeyRef:
                  name: bright-mls-secret
                  key: BRIGHT_MLS_ENV
            - name: BRIGHT_MLS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: bright-mls-secret
                  key: BRIGHT_MLS_CLIENT_ID
            - name: BRIGHT_MLS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bright-mls-secret
                  key: BRIGHT_MLS_CLIENT_SECRET
            - name: BRIGHT_MLS_PAGE_SIZE
              value: "200"
            # The on-demand address loader maps sold records with this delay (#228). Keep it equal
            # to the bright-sync-worker value.
            - name: BRIGHT_SOLD_DISPLAY_DELAY_DAYS
              value: "0"
            # Bearer token for the admin sync endpoint (#338, POST /admin/bright/sync). The
            # endpoint refuses every request while the committed placeholder is set.
            - name: BRIGHT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bright-mls-secret
                  key: BRIGHT_ADMIN_TOKEN
            # Credential introspection (#86/#131). In-cluster DNS, identical in every environment.
            - name: ACCOUNT_SERVICE_INTROSPECT_URL
              value: "http://account-service-svc:8080/internal/account/introspect"
            - name: ACCOUNT_SERVICE_INTROSPECT_TIMEOUT_MS
              value: "2000"
            # Buyer contact lookup for the staff and agent lead dashboards (#689, #691).
            - name: ACCOUNT_SERVICE_CONTACTS_URL
              value: "http://account-service-svc:8080/internal/account/contacts"
            - name: ACCOUNT_SERVICE_CONTACTS_TIMEOUT_MS
              value: "1500"
            # Listing-inquiry rate limits (#131), per IP and per listing. Configuration, not
            # constants, so tuning them needs no code change — see property-service/src/app.ts.
            - name: INQUIRY_RATE_LIMIT_PER_IP_MAX
              value: "5"
            - name: INQUIRY_RATE_LIMIT_PER_IP_WINDOW_MS
              value: "3600000"
            - name: INQUIRY_RATE_LIMIT_PER_LISTING_MAX
              value: "20"
            - name: INQUIRY_RATE_LIMIT_PER_LISTING_WINDOW_MS
              value: "3600000"
            # Dormant (#629): the email delivery worker does not start. The dashboard is the intake.
            # Both entries stay for the later outbox ticket. account-service shares postmark-secret.
            - name: POSTMARK_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: postmark-secret
                  key: POSTMARK_SERVER_TOKEN
            - name: INQUIRY_INTAKE_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: postmark-secret
                  key: INQUIRY_INTAKE_ADDRESS
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # #388: readiness checks the DB (SELECT 1), not just the process, so a pod that can't
            # reach Postgres stops receiving traffic instead of returning slow 5xx responses.
            httpGet:
              path: /health/ready
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3002
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
