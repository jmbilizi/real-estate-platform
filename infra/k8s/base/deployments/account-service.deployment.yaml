apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: default
  labels:
    app: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: api
          # Image format: ghcr.io/<owner>/<repo>/account-service:<tag>
          # CI/CD workflow substitutes GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
          # Local development uses Skaffold override (see podman/local/patches)
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/account-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            # DB values are aligned with infra/k8s/base/configmaps/postgres.configmap.yaml
            - name: ACCOUNT_DB_HOST
              value: "postgres-svc"
            - name: ACCOUNT_DB_PORT
              value: "5432"
            - name: ACCOUNT_DB_NAME
              value: "account_db"
            - name: ACCOUNT_DB_USER
              value: "account_service_db_user"
            - name: ACCOUNT_SERVICE_DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: ACCOUNT_SERVICE_DB_USER_PASSWORD
          livenessProbe:
            httpGet:
              path: /account/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /account/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /account/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
