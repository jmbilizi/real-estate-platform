apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: default
  labels:
    app: api-gateway
spec:
  # Patches can confirm or override this default replica count
  replicas: 1
  # #755: same rollout rule as property-service (#388). The old pod keeps serving until the new
  # pod is Ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: ocelot
          # Image format: ghcr.io/<owner>/<repo>/api-gateway:<tag>
          # CI/CD workflow substitutes GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
          # Local development uses Skaffold override (see podman/local/patches)
          image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/api-gateway:latest
          imagePullPolicy: IfNotPresent
          # Patches can confirm or override these minimal resource settings
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # ASPNETCORE_ENVIRONMENT: Defined in patches (Development/Staging/Production)
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            # Peers allowed to set X-Forwarded-For (#143). The pod CIDR, which holds ingress-nginx.
            # k3s (hetzner-k3s) and Kind both default to 10.244.0.0/16.
            - name: TRUSTED_PROXY_NETWORKS
              value: "10.244.0.0/16"
            # Kubernetes metadata (Downward API)
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # OpenTelemetry (OTEL) integration with Jaeger
            # OTEL_ENABLED: Toggle tracing per environment (defined in patches)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-svc:4317" # gRPC endpoint (faster than HTTP)
            - name: OTEL_SERVICE_NAME
              value: "api-gateway"
            - name: OTEL_TRACES_SAMPLER
              value: "traceidratio"
            # OTEL_TRACES_SAMPLER_ARG: Defined in patches (1.0 dev, 0.5 test, 0.05 prod)
          # #755: keeps the pod serving while the Service endpoints drop it. Without the wait, the
          # pod gets SIGTERM while callers still send it requests, and a rolling restart returns
          # connection errors even with maxUnavailable: 0.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
