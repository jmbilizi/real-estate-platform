apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cribstop-web
  labels:
    app: cribstop-web
  annotations:
    # Next.js WebSocket support (HMR in dev, live features in prod)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cribstop-web-svc
                port:
                  number: 3000
