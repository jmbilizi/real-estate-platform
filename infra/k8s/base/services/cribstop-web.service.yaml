apiVersion: v1
kind: Service
metadata:
  name: cribstop-web-svc
  labels:
    app: cribstop-web
spec:
  type: ClusterIP # Internal only, Ingress exposes externally
  selector:
    app: cribstop-web
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
  sessionAffinity: None
