# Bright MLS ingestion job (#91) — the scheduled vehicle, ahead of the credentials.
#
# Runs the `bright-ingest` entry point of the property-service image (bundled by
# apps/services/property-service/webpack.config.js → additionalEntryPoints, the same mechanism
# `seed-on-start` uses). It is the property-service image with a different command rather than a
# separate project on purpose: `property_db` is property-service's database, its append-only
# migration chain is where #92's staging tables have to land, and `src/db/write.ts` must stay the
# only module that writes `listings` (see apps/services/property-service/AGENTS.md — "the split that
# does matter is by workload, not language").
#
# It nevertheless carries its OWN identity label, `app: bright-mls-ingest`, and therefore its own
# `infra/deploy-control.yaml` key in every environment, so whether this ships to an environment is
# decidable without also deciding whether the Property API ships there.
#
# A run resolves its configuration and either reports "credentials not configured" and exits 0, or
# authenticates, probes `$metadata`, replicates BrightProperties into bright_staging_records, and
# maps staging into properties/units/listings/listing_media (src/jobs/bright-map/).

apiVersion: batch/v1
kind: CronJob
metadata:
  name: bright-mls-ingest
  namespace: default
  labels:
    app: bright-mls-ingest
spec:
  # Schedule and suspend are BOTH overridden per environment, which is what makes the job's cadence
  # and its on/off switch changeable without an image rebuild (infra/k8s/{podman/local,hetzner/*}).
  #
  # The base defaults are fail-safe, not sensible: suspended, so a newly added environment that
  # forgets to patch this cannot silently start issuing authenticated requests against a licensed
  # feed on somebody else's schedule.
  schedule: "0 3 * * *"
  suspend: true
  timeZone: Etc/UTC
  # A replication cursor is single-threaded by nature (#92), so a run that overruns its window must
  # not be joined by the next one. Forbid, never Replace: killing a run mid-cursor is worse than
  # skipping one.
  concurrencyPolicy: Forbid
  # A controller outage must not stampede every missed run at once when it comes back.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: bright-mls-ingest
    spec:
      # Bounded so a failure surfaces as a failed Job rather than a crash loop. A missing credential
      # is NOT a failure — the job exits 0 with a `not_configured` outcome — so these retries only
      # ever apply to a real fault.
      backoffLimit: 2
      # A hung socket must not hold the Forbid lock until the next scheduled run.
      activeDeadlineSeconds: 900
      # Deliberately NO ttlSecondsAfterFinished: the history limits above already bound retention,
      # and a TTL shorter than three scheduling intervals would delete Jobs before those limits ever
      # applied — two mechanisms racing to keep the same three runs, with the wrong one winning.
      template:
        metadata:
          labels:
            app: bright-mls-ingest
        spec:
          restartPolicy: Never
          containers:
            - name: ingest
              # Image format: ghcr.io/<owner>/<repo>/property-service:<tag>
              # CI/CD workflow substitutes GITHUB_REPOSITORY_OWNER, GITHUB_REPOSITORY_NAME
              # Local development uses Skaffold override (see podman/local/patches)
              image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:latest
              imagePullPolicy: IfNotPresent
              command: ["node", "bright-ingest.js"]
              # Sized for the page the job holds in memory, not for an idle process. One page is
              # up to 1000 BrightProperty records of 931 fields each: the response body string,
              # the parsed objects, and a JSON copy per insert chunk all exist at once. 256Mi
              # OOMKilled the container mid-page, which presents as a vanished pod rather than a
              # job error.
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "50m"
                limits:
                  memory: "768Mi"
                  cpu: "500m"
              env:
                # #315: Node sizes its heap from the host, not this cgroup limit. A full page
                # then OOMs inside JSON.parse. Set NODE_OPTIONS to limits.memory / 1.5 (#315).
                # tools/infra/node-heap-ratio.test.js checks this ratio against the limit above.
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=512"
                # ── The staging database ─────────────────────────────────────────────────────
                # Replication writes bright_staging_records and bright_replication_cursor, so the
                # job needs a connection. Assembled exactly as the property-service Deployment
                # assembles it, from the same Secret key — a second spelling of this URL is a
                # second thing to keep in step.
                #
                # Without it the run authenticates, probes $metadata, and then throws
                # "DATABASE_URL is not set" on the first staging write. Every run, forever.
                - name: PROPERTY_DB_HOST
                  value: "postgres-svc"
                - name: PROPERTY_DB_PORT
                  value: "5432"
                - name: PROPERTY_DB_NAME
                  value: "property_db"
                - name: PROPERTY_DB_USER
                  value: "property_service_db_user"
                - name: PROPERTY_SERVICE_DB_USER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: PROPERTY_SERVICE_DB_USER_PASSWORD
                - name: DATABASE_URL
                  value: "postgresql://$(PROPERTY_DB_USER):$(PROPERTY_SERVICE_DB_USER_PASSWORD)@$(PROPERTY_DB_HOST):$(PROPERTY_DB_PORT)/$(PROPERTY_DB_NAME)"
                # Records per request. A full 1000-record production page did not return within
                # 120 s (2026-09-22); smaller pages keep every request short. See replicate.ts.
                - name: BRIGHT_MLS_PAGE_SIZE
                  value: "200"
                # ── Which feed, and the credential for it ────────────────────────────────────
                # Three keys, all in bright-mls-secret. BRIGHT_MLS_ENV (`test` or `production`)
                # states which Bright tier the client credential belongs to. The job trusts it
                # exactly and derives the endpoints from it (config.ts → BRIGHT_FEED_ENDPOINTS).
                # Any environment may hold either tier. Values come from GitHub ENVIRONMENT secrets
                # in CI and from `.env` locally. The committed template holds `StrongBase64Password`
                # placeholders, which the job treats as "not configured" and never transmits.
                #
                # None of these references is `optional: true`: if bright-mls-secret is missing from
                # a cluster the pod must fail to start with an obvious reason, rather than run and
                # quietly report "no credentials" for a wiring mistake.
                - name: BRIGHT_MLS_ENV
                  valueFrom:
                    secretKeyRef:
                      name: bright-mls-secret
                      key: BRIGHT_MLS_ENV
                - name: BRIGHT_MLS_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: bright-mls-secret
                      key: BRIGHT_MLS_CLIENT_ID
                - name: BRIGHT_MLS_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: bright-mls-secret
                      key: BRIGHT_MLS_CLIENT_SECRET
