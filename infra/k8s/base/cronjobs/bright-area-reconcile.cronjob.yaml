# Daily Bright key reconciliation (#331).
#
# Runs the `bright-area-sync` entry of the property-service image with the "reconcile" mode
# argument — the same bundled entry `bright-area-refresh` uses, different command. See that
# CronJob's header for why this is the property-service image rather than a separate project.
#
# RESO sends no delete event. For every area `bright_area_sync` (#329) tracks, reads Bright's live
# `ListingKey` set across every tracked status and soft-deletes (`deleted_at`, via
# `src/db/write.ts`) a local listing whose key is absent from all of them. A listing whose key
# moved to a DIFFERENT tracked status is a status change, never treated as a delete — see
# `run-reconcile.ts`.
#
# Own identity label (`app: bright-area-reconcile`), own `infra/deploy-control.yaml` key.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: bright-area-reconcile
  namespace: default
  labels:
    app: bright-area-reconcile
spec:
  # Fail-safe base default: suspended. Every environment overrides both fields.
  schedule: "30 4 * * *"
  suspend: true
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: bright-area-reconcile
    spec:
      backoffLimit: 2
      # A full-area key read has no delta window to shrink it, so this run gets more headroom
      # than the refresh job's.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: bright-area-reconcile
        spec:
          restartPolicy: Never
          containers:
            - name: reconcile
              image: ghcr.io/GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY_NAME/property-service:latest
              imagePullPolicy: IfNotPresent
              command: ["node", "bright-area-sync.js", "reconcile"]
              resources:
                requests:
                  memory: "192Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "300m"
              env:
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=341"
                - name: PROPERTY_DB_HOST
                  value: "postgres-svc"
                - name: PROPERTY_DB_PORT
                  value: "5432"
                - name: PROPERTY_DB_NAME
                  value: "property_db"
                - name: PROPERTY_DB_USER
                  value: "property_service_db_user"
                - name: PROPERTY_SERVICE_DB_USER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: PROPERTY_SERVICE_DB_USER_PASSWORD
                - name: DATABASE_URL
                  value: "postgresql://$(PROPERTY_DB_USER):$(PROPERTY_SERVICE_DB_USER_PASSWORD)@$(PROPERTY_DB_HOST):$(PROPERTY_DB_PORT)/$(PROPERTY_DB_NAME)"
                - name: BRIGHT_MLS_ENV
                  valueFrom:
                    secretKeyRef:
                      name: bright-mls-secret
                      key: BRIGHT_MLS_ENV
                - name: BRIGHT_MLS_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: bright-mls-secret
                      key: BRIGHT_MLS_CLIENT_ID
                - name: BRIGHT_MLS_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: bright-mls-secret
                      key: BRIGHT_MLS_CLIENT_SECRET
