# #269: only api-gateway may reach property-service. The inquiry rate limit (#131) keys on
# X-Real-IP, and the gateway is the only caller that sets it. Kubelet probes come from the node
# and the policy allows them. No ingress-nginx rule: the Ingress targets api-gateway-svc.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: property-service-ingress
  labels:
    app: property-service
spec:
  podSelector:
    matchLabels:
      app: property-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 3002
