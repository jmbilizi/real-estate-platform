apiVersion: v1
kind: Secret
metadata:
  name: account-service-secret
  labels:
    app: account-service
type: Opaque
stringData:
  # The committed value is the placeholder. Kustomize strategic-merges `stringData` key by key, so an
  # environment that supplies nothing keeps it, and the sending code must read that sentinel as
  # "not configured" and refuse to send rather than attempting delivery.
  # use this to generate EMAIL_CODE_HMAC_KEY and POSTMARK_WEBHOOK_PASSWORD: node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"

  # This key is used to HMAC email codes sent by the account service.
  ACCOUNT_SERVICE_EMAIL_CODE_HMAC_KEY: StrongBase64Password
  # This key is used to authenticate Postmark webhooks sent to the account service.
  ACCOUNT_SERVICE_POSTMARK_WEBHOOK_PASSWORD: StrongBase64Password
  # Postmark webhooks user name for our apps
  ACCOUNT_SERVICE_POSTMARK_WEBHOOK_USER: StrongBase64Password
