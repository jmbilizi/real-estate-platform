apiVersion: v1
kind: Secret
metadata:
  name: account-service-secret
  labels:
    app: account-service
type: Opaque
stringData:
  # The committed value is the placeholder. Kustomize strategic-merges `stringData` key by key, so an
  # environment that supplies nothing keeps it, and the sending code must read that sentinel as
  # "not configured" and refuse to send rather than attempting delivery.
  # use this to generate EMAIL_CODE_HMAC_KEY, UNSUBSCRIBE_HMAC_KEY, INTERNAL_KEY, and POSTMARK_WEBHOOK_PASSWORD: node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"

  # This key is used to HMAC email codes sent by the account service.
  ACCOUNT_SERVICE_EMAIL_CODE_HMAC_KEY: StrongBase64Password
  # This key is used to authenticate Postmark webhooks sent to the account service.
  ACCOUNT_SERVICE_POSTMARK_WEBHOOK_PASSWORD: StrongBase64Password
  # Postmark webhooks user name for our apps
  ACCOUNT_SERVICE_POSTMARK_WEBHOOK_USER: StrongBase64Password
  # This key is used to HMAC unsubscribe requests sent to the account service.
  ACCOUNT_SERVICE_UNSUBSCRIBE_HMAC_KEY: StrongBase64Password
  # This key is used for internal service-to-service authentication within the account service.
  ACCOUNT_SERVICE_INTERNAL_KEY: StrongBase64Password
  # The Google OAuth client ID (type Web application) for "Continue with Google" (#1049). It is public,
  # so a repository variable supplies it. Both account-service (token audience) and cribstop-web (the
  # button) read it. The placeholder reads as "not configured": the button hides and the endpoint answers 503.
  ACCOUNT_SERVICE_GOOGLE_CLIENT_ID: StrongBase64Password
