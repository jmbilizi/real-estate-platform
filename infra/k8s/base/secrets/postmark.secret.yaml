apiVersion: v1
kind: Secret
metadata:
  name: postmark-secret
  labels:
    app: account-service
type: Opaque
stringData:
# The committed value is the placeholder. Kustomize strategic-merges `stringData` key by key, so an
# environment that supplies nothing keeps it, and the sending code must read that sentinel as
# "not configured" and refuse to send rather than attempting delivery (#138).
  POSTMARK_SERVER_TOKEN: StrongBase64Password