apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  labels:
    app: api-gateway
type: Opaque
stringData:
  # htpasswd-format credential (user:$apr1$...), NOT a plain password.
  # Gates the api-gateway Ingress in every environment.
  # api-gateway-svc does not traverse the Ingress and is unaffected.
  auth: StrongBase64Password
