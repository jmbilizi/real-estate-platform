apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  labels:
    app: api-gateway
type: Opaque
stringData:
  # htpasswd format for basic auth: username:hashed_password
  # Local default: admin / admin (same test credential as jaeger-secret)
  # Workflow substitutes with the real per-environment htpasswd from GitHub Secrets
  # Gates the api-gateway Ingress in every environment.
  # api-gateway-svc does not traverse the Ingress and is unaffected.
  auth: admin:$2y$10$mkgiQ4wjXGcTyixW0q8hi.okPnjjVEruTNEZMs8I6z9yfeLjv1C42
