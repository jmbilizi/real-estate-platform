apiVersion: v1
kind: Secret
metadata:
  name: jaeger-secret
  labels:
    app: jaeger
type: Opaque
stringData:
  # htpasswd format for basic auth: username:hashed_password
  # Local default: admin / admin (for testing basic auth locally)
  # Workflow substitutes with production htpasswd from GitHub Secrets
  # Generate htpasswd: https://hostingcanada.org/htpasswd-generator/ (use BCrypt encryption)
  # Example output: admin:$2y$10$xyz... (BCrypt)
  auth: admin:$2y$10$mkgiQ4wjXGcTyixW0q8hi.okPnjjVEruTNEZMs8I6z9yfeLjv1C42
