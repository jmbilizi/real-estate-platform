apiVersion: v1
kind: Secret
metadata:
  name: jaeger-secret
  labels:
    app: jaeger
type: Opaque
stringData:
  # htpasswd format for basic auth: username:hashed_password
  # Local default: admin / admin (for testing basic auth locally)
  # Workflow substitutes with production htpasswd from GitHub Secrets
  # Generate production htpasswd: htpasswd -nb username password
  # Example output: admin:$apr1$xyz...
  auth: admin:$apr1$ruca84Hq$mbjdMZBAG.KWn7vfN/SNK/
