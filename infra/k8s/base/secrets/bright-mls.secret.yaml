apiVersion: v1
kind: Secret
metadata:
  name: bright-mls-secret
  labels:
    app: bright-mls-ingest
type: Opaque
stringData:
  # Bright MLS RESO Web API OAuth2 client_credentials (#91, provisioned by #117).
  # Same field names in every environment, DIFFERENT values, sourced from GitHub
  # ENVIRONMENT secrets (dev = Bright TEST/STAGING feed, prod = LICENSED PRODUCTION,
  # test/local = none). Substituted in-memory by the deploy action; never committed.
  BRIGHT_MLS_CLIENT_ID: StrongBase64Password
  BRIGHT_MLS_CLIENT_SECRET: StrongBase64Password