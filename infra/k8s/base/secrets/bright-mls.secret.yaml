apiVersion: v1
kind: Secret
metadata:
  name: bright-mls-secret
  labels:
    app: bright-mls-ingest
type: Opaque
stringData:
  # Bright MLS RESO Web API OAuth2 client_credentials (#91, provisioned by #117).
  # Tier-suffixed pairs, one per feed (#246). BRIGHT_MLS_ENV picks which pair a run
  # reads, and the resolver never reads the other pair, so a credential filed under
  # the wrong tier key is inert rather than transmitted. Same field names in every
  # environment, DIFFERENT values, sourced from GitHub ENVIRONMENT secrets.
  # Substituted in-memory by the deploy action; never committed.
  #
  # BRIGHT_MLS_CLIENT_ID / BRIGHT_MLS_CLIENT_SECRET are the pre-#246 unsuffixed pair,
  # kept for one release as a migration fallback (see config.ts). Delete once every
  # environment is provisioned on the tier-suffixed keys (#117).
  BRIGHT_MLS_CLIENT_ID: StrongBase64Password
  BRIGHT_MLS_CLIENT_SECRET: StrongBase64Password
  BRIGHT_MLS_TEST_CLIENT_ID: StrongBase64Password
  BRIGHT_MLS_TEST_CLIENT_SECRET: StrongBase64Password
  BRIGHT_MLS_PROD_CLIENT_ID: StrongBase64Password
  BRIGHT_MLS_PROD_CLIENT_SECRET: StrongBase64Password
