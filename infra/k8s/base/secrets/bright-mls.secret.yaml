apiVersion: v1
kind: Secret
metadata:
  name: bright-mls-secret
  labels:
    app: bright-mls-ingest
type: Opaque
stringData:
  # Bright MLS RESO Web API OAuth2 client_credentials (#91, provisioned by #117).
  # BRIGHT_MLS_ENV declares which Bright tier the credential belongs to: `test` or
  # `production`. The job trusts it exactly and derives the endpoints from it (config.ts →
  # BRIGHT_FEED_ENDPOINTS). Any environment may hold either tier. Values come from GitHub
  # ENVIRONMENT secrets in CI and from `.env` locally; never committed.
  BRIGHT_MLS_ENV: StrongBase64Password
  BRIGHT_MLS_CLIENT_ID: StrongBase64Password
  BRIGHT_MLS_CLIENT_SECRET: StrongBase64Password
