apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pinned upstream manifest. A standalone kustomization so the local Skaffold `ingress-nginx`
# module (#101) can deploy it ahead of every Ingress. The base includes it as a directory.
resources:
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/cloud/deploy.yaml
